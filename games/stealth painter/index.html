<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stealth Painter</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-pink: #ff0055;
            --neon-blue: #00d2ff;
            --dark-bg: #0b0e14;
            --card-bg: #1a1d24;
            --gold: #ffd700;
            --danger: #ff4757;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        
        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(57, 255, 20, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(188, 19, 254, 0.05) 0%, transparent 40%);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #333;
        }
        
        #gameCanvas {
            display: block;
            background: #050505;
            max-width: 100vw;
            max-height: 80vh;
            width: 600px;
            height: 600px;
        }
        
        /* HUD & Stats */
        .hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(26, 29, 36, 0.9);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            width: max-content;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .stat-label { font-size: 0.6rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Bungee', cursive; font-size: 1.1rem; color: var(--neon-green); }
        .stat-value.score { color: var(--gold); }
        .stat-value.lives { color: var(--neon-pink); }
        
        .progress-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--neon-green);
        }

        .level-target-marker {
            position: absolute;
            top: -20px;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--neon-blue);
            text-transform: uppercase;
        }
        
        /* Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
        }
        
        .modal h1 {
            font-family: 'Bungee', cursive;
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
        }
        
        .modal h2 {
            font-family: 'Permanent Marker', cursive;
            color: var(--neon-pink);
            font-size: 1.5rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .modal p {
            color: #ccc;
            font-size: 1rem;
            margin-bottom: 20px;
            max-width: 400px;
            line-height: 1.6;
        }
        
        .modal button {
            background: var(--neon-green);
            color: black;
            border: none;
            padding: 15px 40px;
            font-family: 'Bungee', cursive;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
        }
        
        .modal button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.6);
        }

        .controls-hint {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 25px 0;
            text-align: left;
            font-size: 0.85rem;
            color: #888;
        }

        .hint-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hint-icon {
            background: #222;
            padding: 5px 8px;
            border-radius: 4px;
            color: var(--neon-blue);
            font-weight: bold;
            min-width: 35px;
            text-align: center;
        }
        
        /* Mobile Specific */
        #joystick-ui {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(0, 210, 255, 0.2);
            border-radius: 50%;
            display: none;
            z-index: 10;
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: var(--neon-blue);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        @media (pointer: coarse) {
            #joystick-ui { display: block; }
            .modal h1 { font-size: 2.5rem; }
        }

        .combo-text {
            position: absolute;
            pointer-events: none;
            font-family: 'Bungee', cursive;
            color: var(--gold);
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            z-index: 20;
            animation: combo-float 0.8s ease-out forwards;
        }

        @keyframes combo-float {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: translateY(-50px) scale(1); opacity: 0; }
        }

        .caught-bg {
            background: radial-gradient(circle, rgba(255,0,85,0.2) 0%, transparent 70%);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { opacity: 0.3; }
            50% { opacity: 0.7; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="hud" id="hud" style="display: none;">
            <div class="stat-item">
                <span class="stat-label">Level</span>
                <span id="levelNum" class="stat-value">1</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Score</span>
                <span id="scoreVal" class="stat-value score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Spirit</span>
                <span id="livesVal" class="stat-value lives">❤️❤️❤️</span>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="level-target-marker" id="targetLabel">Target: 75%</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="modal" id="startModal">
            <h1>Stealth Painter</h1>
            <p>You are a ghost in the machine. Infiltrate the high-security districts and mark your territory with Spirit Ink.</p>
            
            <div class="controls-hint">
                <div class="hint-item"><span class="hint-icon">WASD</span> Move Shinobi</div>
                <div class="hint-item"><span class="hint-icon">SPACE</span> Shadow Leap</div>
                <div class="hint-item"><span class="hint-icon">TAGS</span> Collect Sprays</div>
                <div class="hint-item"><span class="hint-icon">EYES</span> Avoid Guards</div>
            </div>

            <button onclick="game.startGame()">DEPLOY PAINTER</button>
        </div>
    </div>

    <div id="joystick-ui"><div id="joystick-knob"></div></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game constants
        const GRID_SIZE = 20;
        let TILE_SIZE = 30;
        
        const COLORS = {
            unpainted: '#0a0a0a',
            painted: ['#39ff14', '#bc13fe', '#00d2ff', '#ff0055'],
            obstacle: '#1a1a1a',
            player: '#39ff14',
            guard: '#ff0055',
            visionCone: 'rgba(255, 0, 85, 0.15)',
            sprayCan: '#00d2ff'
        };
        
        const LEVELS = [
            {
                name: "Shibuya Underground",
                target: 45,
                guards: [
                    { startX: 5, startY: 10, patrol: 'horizontal', range: [3, 12], speed: 1.5 },
                    { startX: 15, startY: 10, patrol: 'vertical', range: [5, 15], speed: 1.5 }
                ],
                obstacles: [{ x: 10, y: 5 }, { x: 10, y: 6 }, { x: 8, y: 14 }, { x: 11, y: 14 }],
                sprays: 5
            },
            {
                name: "Neon District",
                target: 55,
                guards: [
                    { startX: 3, startY: 5, patrol: 'horizontal', range: [2, 10], speed: 2 },
                    { startX: 15, startY: 4, patrol: 'vertical', range: [3, 12], speed: 2 }
                ],
                obstacles: [{ x: 5, y: 5 }, { x: 14, y: 5 }, { x: 5, y: 14 }, { x: 14, y: 14 }, { x: 10, y: 10 }],
                sprays: 6
            },
            {
                name: "Techno Plaza",
                target: 65,
                guards: [
                    { startX: 5, startY: 5, patrol: 'rectangle', points: [{x:5,y:5},{x:15,y:5},{x:15,y:10},{x:5,y:10}], speed: 2.2 },
                    { startX: 10, startY: 15, patrol: 'horizontal', range: [5, 15], speed: 2.5 }
                ],
                obstacles: [{ x: 7, y: 7 }, { x: 12, y: 7 }, { x: 7, y: 13 }, { x: 12, y: 13 }],
                sprays: 7
            },
            {
                name: "Sky Tower",
                target: 75,
                guards: [
                    { startX: 4, startY: 4, patrol: 'rectangle', points: [{x:4,y:4},{x:16,y:4},{x:16,y:16},{x:4,y:16}], speed: 2.8 },
                    { startX: 10, startY: 10, patrol: 'horizontal', range: [5, 15], speed: 3 }
                ],
                obstacles: [{ x: 9, y: 9 }, { x: 10, y: 9 }, { x: 9, y: 10 }, { x: 10, y: 10 }],
                sprays: 8
            },
            {
                name: "Final Citadel",
                target: 85,
                guards: [
                    { startX: 2, startY: 2, patrol: 'rectangle', points: [{x:2,y:2},{x:17,y:2},{x:17,y:17},{x:2,y:17}], speed: 3.5 },
                    { startX: 5, startY: 10, patrol: 'horizontal', range: [3, 16], speed: 3.2 },
                    { startX: 10, startY: 5, patrol: 'vertical', range: [3, 16], speed: 3.2 }
                ],
                obstacles: [{ x: 10, y: 10 }],
                sprays: 10
            }
        ];
        
        const game = {
            state: 'menu',
            currentLevel: 0,
            grid: [],
            player: { x: 1, y: 1, direction: 'right', painted: false, paintColor: 0, moving: false, hopAnimation: 0, scale: 1 },
            guards: [],
            obstacles: new Set(),
            sprays: [],
            particles: [],
            paintedCount: 0,
            score: 0,
            lives: 3,
            combo: 0,
            screenShake: 0,
            keys: {},
            lastMoveTime: 0,
            moveDelay: 120,
            
            init() {
                this.updateCanvasSize();
                window.addEventListener('resize', () => this.updateCanvasSize());
                this.setupKeyboard();
                this.setupMobile();
                
                // Static grid background pattern
                this.patternCanvas = document.createElement('canvas');
                this.updatePattern();
            },

            updatePattern() {
                this.patternCanvas.width = canvas.width;
                this.patternCanvas.height = canvas.height;
                const pctx = this.patternCanvas.getContext('2d');
                pctx.strokeStyle = '#111';
                pctx.lineWidth = 1;
                for(let i=0; i<=GRID_SIZE; i++) {
                    pctx.beginPath();
                    pctx.moveTo(i*TILE_SIZE, 0); pctx.lineTo(i*TILE_SIZE, canvas.height);
                    pctx.stroke();
                    pctx.beginPath();
                    pctx.moveTo(0, i*TILE_SIZE); pctx.lineTo(canvas.width, i*TILE_SIZE);
                    pctx.stroke();
                }
            },
            
            updateCanvasSize() {
                const size = Math.min(window.innerWidth - 40, window.innerHeight - 150, 600);
                canvas.width = size;
                canvas.height = size;
                TILE_SIZE = size / GRID_SIZE;
                if(this.patternCanvas) this.updatePattern();
            },
            
            setupKeyboard() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (this.state === 'playing' && !this.player.moving) {
                        const now = Date.now();
                        if (now - this.lastMoveTime < this.moveDelay) return;
                        
                        if (e.code === 'Space') {
                            e.preventDefault();
                            this.hop();
                        } else if (['ArrowUp', 'KeyW'].includes(e.code)) {
                            e.preventDefault(); this.movePlayer('up');
                        } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
                            e.preventDefault(); this.movePlayer('down');
                        } else if (['ArrowLeft', 'KeyA'].includes(e.code)) {
                            e.preventDefault(); this.movePlayer('left');
                        } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
                            e.preventDefault(); this.movePlayer('right');
                        }
                    }
                });
                document.addEventListener('keyup', (e) => this.keys[e.code] = false);
            },

            setupMobile() {
                const joyBase = document.getElementById('joystick-ui');
                const knob = document.getElementById('joystick-knob');
                let touchId = null;

                const handleJoystick = (e) => {
                    e.preventDefault();
                    const touch = Array.from(e.touches).find(t => t.target === joyBase || joyBase.contains(t.target));
                    if (!touch) return;

                    const rect = joyBase.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    
                    const dx = touch.clientX - centerX;
                    const dy = touch.clientY - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = rect.width / 2;
                    
                    const limitedDist = Math.min(dist, maxDist);
                    const angle = Math.atan2(dy, dx);
                    
                    const knobX = Math.cos(angle) * limitedDist;
                    const knobY = Math.sin(angle) * limitedDist;
                    
                    knob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

                    // Deadzone and Directional Trigger
                    if (limitedDist > maxDist * 0.3) {
                        const absX = Math.abs(dx);
                        const absY = Math.abs(dy);
                        
                        if (absX > absY) {
                            this.movePlayer(dx > 0 ? 'right' : 'left');
                        } else {
                            this.movePlayer(dy > 0 ? 'down' : 'up');
                        }
                    }
                };

                joyBase.addEventListener('touchstart', (e) => {
                    handleJoystick(e);
                }, {passive: false});

                joyBase.addEventListener('touchmove', (e) => {
                    handleJoystick(e);
                }, {passive: false});

                joyBase.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    knob.style.transform = `translate(-50%, -50%)`;
                }, {passive: false});

                // Separate tap on canvas for Leap
                let canvasTouchStart = 0;
                canvas.addEventListener('touchstart', (e) => {
                    canvasTouchStart = Date.now();
                }, {passive: true});

                canvas.addEventListener('touchend', (e) => {
                    if (Date.now() - canvasTouchStart < 200) {
                        this.hop();
                    }
                }, {passive: true});
            },
            
            startGame() {
                document.getElementById('startModal').style.display = 'none';
                document.getElementById('hud').style.display = 'flex';
                document.getElementById('progressContainer').style.display = 'block';
                this.currentLevel = 0;
                this.score = 0;
                this.lives = 3;
                this.loadLevel();
                this.state = 'playing';
                this.updateUI();
                requestAnimationFrame(() => this.gameLoop());
            },
            
            loadLevel() {
                const level = LEVELS[this.currentLevel];
                this.grid = Array.from({length: GRID_SIZE}, () => 
                    Array.from({length: GRID_SIZE}, () => ({ painted: false, color: 0 }))
                );
                
                this.player = { x: 1, y: 1, direction: 'right', painted: false, paintColor: 0, moving: false, hopAnimation: 0, scale: 1 };
                this.obstacles = new Set(level.obstacles.map(o => `${o.x},${o.y}`));
                this.guards = level.guards.map(g => ({
                    ...g, x: g.startX, y: g.startY, direction: g.patrol === 'horizontal' ? 'right' : 'down',
                    moveProgress: 0, pointIndex: 0
                }));
                
                this.sprays = [];
                const spots = [];
                for(let y=2; y<GRID_SIZE-2; y++) {
                    for(let x=2; x<GRID_SIZE-2; x++) {
                        if(!this.obstacles.has(`${x},${y}`)) spots.push({x,y});
                    }
                }
                for(let i=0; i<level.sprays; i++) {
                    const s = spots.splice(Math.floor(Math.random()*spots.length), 1)[0];
                    if(s) this.sprays.push({...s, rot: Math.random()*Math.PI*2});
                }
                
                this.paintedCount = 0;
                this.particles = [];
                this.combo = 0;
                document.getElementById('levelNum').textContent = this.currentLevel + 1;
                document.getElementById('targetLabel').textContent = `Target: ${level.target}%`;
                this.updateProgress();
            },
            
            movePlayer(dir) {
                if (this.state !== 'playing' || this.player.moving) return;
                this.player.direction = dir;
                const nx = this.player.x + (dir === 'left' ? -1 : dir === 'right' ? 1 : 0);
                const ny = this.player.y + (dir === 'up' ? -1 : dir === 'down' ? 1 : 0);
                
                if (this.isValid(nx, ny)) {
                    this.executeMove(nx, ny);
                } else {
                    this.screenShake = 3;
                }
            },
            
            hop() {
                if (this.state !== 'playing' || this.player.moving) return;
                const dir = this.player.direction;
                const nx = this.player.x + (dir === 'left' ? -2 : dir === 'right' ? 2 : 0);
                const ny = this.player.y + (dir === 'up' ? -2 : dir === 'down' ? 2 : 0);
                
                if (this.isValid(nx, ny)) {
                    this.player.hopAnimation = 1;
                    this.executeMove(nx, ny, true);
                }
            },

            isValid(x, y) {
                return x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE && !this.obstacles.has(`${x},${y}`);
            },

            executeMove(nx, ny, isHop = false) {
                this.player.moving = true;
                this.lastMoveTime = Date.now();
                
                setTimeout(() => {
                    const oldX = this.player.x, oldY = this.player.y;
                    this.player.x = nx;
                    this.player.y = ny;
                    this.player.moving = false;
                    
                    // Spray Check
                    const si = this.sprays.findIndex(s => s.x === nx && s.y === ny);
                    if(si !== -1) {
                        this.sprays.splice(si, 1);
                        this.player.painted = true;
                        this.player.paintColor = (this.player.paintColor + 1) % COLORS.painted.length;
                        this.createSplash(nx, ny, COLORS.painted[this.player.paintColor]);
                        this.score += 50;
                        this.showComboText(nx, ny, "+50");
                    }

                    // Paint Logic (Trail)
                    if(this.player.painted) {
                        this.paintLine(oldX, oldY, nx, ny);
                    }
                    this.updateUI();
                }, isHop ? 180 : 100);
            },

            paintLine(x1, y1, x2, y2) {
                const steps = Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
                for(let i=0; i<=steps; i++) {
                    const px = Math.round(x1 + (x2-x1) * (i/steps));
                    const py = Math.round(y1 + (y2-y1) * (i/steps));
                    if(!this.grid[py][px].painted) {
                        this.grid[py][px].painted = true;
                        this.grid[py][px].color = this.player.paintColor;
                        this.paintedCount++;
                        this.score += 10;
                        this.createSplash(px, py, COLORS.painted[this.player.paintColor], 3);
                    }
                }
                this.updateProgress();
                this.checkWin();
            },
            
            updateUI() {
                document.getElementById('scoreVal').textContent = this.score;
                document.getElementById('livesVal').textContent = '❤️'.repeat(this.lives);
            },

            updateProgress() {
                const level = LEVELS[this.currentLevel];
                const total = GRID_SIZE * GRID_SIZE - this.obstacles.size;
                const p = Math.floor((this.paintedCount / total) * 100);
                document.getElementById('progressFill').style.width = p + '%';
            },

            showComboText(x, y, text) {
                const div = document.createElement('div');
                div.className = 'combo-text';
                div.textContent = text;
                const rect = canvas.getBoundingClientRect();
                div.style.left = rect.left + (x + 0.5) * TILE_SIZE + 'px';
                div.style.top = rect.top + (y + 0.5) * TILE_SIZE + 'px';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 800);
            },

            createSplash(x, y, color, count = 12) {
                for(let i=0; i<count; i++) {
                    this.particles.push({
                        x: (x + 0.5) * TILE_SIZE, y: (y + 0.5) * TILE_SIZE,
                        vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                        life: 1, color, size: Math.random()*3 + 2
                    });
                }
            },

            updateGuards(dt) {
                this.guards.forEach(g => {
                    g.moveProgress += g.speed * dt;
                    if(g.moveProgress >= 1) {
                        g.moveProgress = 0;
                        if(g.patrol === 'horizontal') {
                            const nx = g.x + (g.direction === 'right' ? 1 : -1);
                            if(nx < g.range[0] || nx > g.range[1]) g.direction = g.direction === 'right' ? 'left' : 'right';
                            else g.x = nx;
                        } else if(g.patrol === 'vertical') {
                            const ny = g.y + (g.direction === 'down' ? 1 : -1);
                            if(ny < g.range[0] || ny > g.range[1]) g.direction = g.direction === 'down' ? 'up' : 'down';
                            else g.y = ny;
                        } else if(g.patrol === 'rectangle') {
                            g.pointIndex = (g.pointIndex + 1) % g.points.length;
                            const target = g.points[g.pointIndex];
                            const prev = g.points[(g.pointIndex - 1 + g.points.length) % g.points.length];
                            if(target.x > prev.x) g.direction = 'right';
                            else if(target.x < prev.x) g.direction = 'left';
                            else if(target.y > prev.y) g.direction = 'down';
                            else if(target.y < prev.y) g.direction = 'up';
                            g.x = target.x; g.y = target.y;
                        }
                    }
                });
            },

            checkVision() {
                for(let g of this.guards) {
                    const cone = this.getVision(g);
                    if(cone.some(t => t.x === this.player.x && t.y === this.player.y)) {
                        this.hit();
                        return;
                    }
                }
            },

            getVision(g) {
                const tiles = [];
                const len = 4;
                for(let i=1; i<=len; i++) {
                    for(let j=-i; j<=i; j++) {
                        let tx = g.x, ty = g.y;
                        if(g.direction === 'right') { tx += i; ty += j; }
                        else if(g.direction === 'left') { tx -= i; ty += j; }
                        else if(g.direction === 'down') { ty += i; tx += j; }
                        else if(g.direction === 'up') { ty -= i; tx += j; }
                        if(tx>=0 && tx<GRID_SIZE && ty>=0 && ty<GRID_SIZE) tiles.push({x:tx, y:ty});
                    }
                }
                return tiles;
            },

            hit() {
                this.state = 'hit';
                this.lives--;
                this.screenShake = 15;
                this.updateUI();
                
                if(this.lives <= 0) {
                    this.gameOver();
                } else {
                    setTimeout(() => {
                        this.player.x = 1; this.player.y = 1;
                        this.state = 'playing';
                    }, 1000);
                }
            },

            checkWin() {
                const total = GRID_SIZE * GRID_SIZE - this.obstacles.size;
                const p = (this.paintedCount / total) * 100;
                if(p >= LEVELS[this.currentLevel].target) this.win();
            },

            win() {
                this.state = 'win';
                const isLast = this.currentLevel === LEVELS.length - 1;
                this.showModal(isLast ? "MISSION CLEAR" : "DISTRICT SECURED", 
                    isLast ? "The city is yours. You are the ultimate Shinobi." : `District ${this.currentLevel+1} tagged successfully.`,
                    isLast ? "RESTART" : "NEXT DISTRICT", () => isLast ? location.reload() : this.nextLevel());
            },

            gameOver() {
                this.state = 'gameover';
                this.showModal("MISSION FAILED", "You were detected too many times. The network has locked you out.", "RETRY", () => location.reload());
            },

            showModal(title, text, btnText, action) {
                const m = document.createElement('div');
                m.className = 'modal';
                m.innerHTML = `<h1>${title}</h1><p>${text}</p><button id="modalBtn">${btnText}</button>`;
                document.getElementById('gameContainer').appendChild(m);
                document.getElementById('modalBtn').onclick = action;
            },

            nextLevel() {
                document.querySelectorAll('.modal').forEach(m => { if(m.id !== 'startModal') m.remove(); });
                this.currentLevel++;
                this.loadLevel();
                this.state = 'playing';
            },

            draw() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.save();
                if(this.screenShake > 0) {
                    ctx.translate((Math.random()-0.5)*this.screenShake, (Math.random()-0.5)*this.screenShake);
                    this.screenShake *= 0.9;
                }

                // Grid background
                ctx.drawImage(this.patternCanvas, 0, 0);

                // Painted Tiles
                for(let y=0; y<GRID_SIZE; y++) {
                    for(let x=0; x<GRID_SIZE; x++) {
                        const t = this.grid[y][x];
                        if(t.painted) {
                            ctx.fillStyle = COLORS.painted[t.color];
                            ctx.globalAlpha = 0.3;
                            ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                            ctx.globalAlpha = 1;
                            ctx.strokeStyle = COLORS.painted[t.color];
                            ctx.lineWidth = 1;
                            ctx.strokeRect(x*TILE_SIZE+2, y*TILE_SIZE+2, TILE_SIZE-4, TILE_SIZE-4);
                        }
                    }
                }

                // Obstacles
                ctx.fillStyle = COLORS.obstacle;
                this.obstacles.forEach(o => {
                    const [ox, oy] = o.split(',').map(Number);
                    ctx.fillRect(ox*TILE_SIZE+2, oy*TILE_SIZE+2, TILE_SIZE-4, TILE_SIZE-4);
                    ctx.strokeStyle = '#333';
                    ctx.strokeRect(ox*TILE_SIZE+4, oy*TILE_SIZE+4, TILE_SIZE-8, TILE_SIZE-8);
                });

                // Sprays
                this.sprays.forEach(s => {
                    s.rot += 0.05;
                    ctx.save();
                    ctx.translate((s.x+0.5)*TILE_SIZE, (s.y+0.5)*TILE_SIZE);
                    ctx.rotate(s.rot);
                    ctx.fillStyle = COLORS.sprayCan;
                    ctx.fillRect(-6, -8, 12, 16);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-2, -10, 4, 2);
                    ctx.restore();
                    // Glow
                    ctx.shadowBlur = 10; ctx.shadowColor = COLORS.sprayCan;
                    ctx.strokeStyle = COLORS.sprayCan;
                    ctx.strokeRect(s.x*TILE_SIZE+5, s.y*TILE_SIZE+5, TILE_SIZE-10, TILE_SIZE-10);
                    ctx.shadowBlur = 0;
                });

                // Vision Cones
                this.guards.forEach(g => {
                    const cone = this.getVision(g);
                    ctx.fillStyle = COLORS.visionCone;
                    cone.forEach(t => ctx.fillRect(t.x*TILE_SIZE, t.y*TILE_SIZE, TILE_SIZE, TILE_SIZE));
                });

                // Guards
                this.guards.forEach(g => {
                    ctx.fillStyle = COLORS.guard;
                    ctx.beginPath(); ctx.arc((g.x+0.5)*TILE_SIZE, (g.y+0.5)*TILE_SIZE, 10, 0, Math.PI*2); ctx.fill();
                    // Guard Eye
                    ctx.fillStyle = '#fff';
                    const off = {right:[4,0], left:[-4,0], up:[0,-4], down:[0,4]}[g.direction];
                    ctx.beginPath(); ctx.arc((g.x+0.5)*TILE_SIZE+off[0], (g.y+0.5)*TILE_SIZE+off[1], 3, 0, Math.PI*2); ctx.fill();
                });

                // Player
                const pyOff = this.player.hopAnimation > 0 ? -Math.sin(this.player.hopAnimation*Math.PI)*15 : 0;
                ctx.save();
                ctx.translate((this.player.x+0.5)*TILE_SIZE, (this.player.y+0.5)*TILE_SIZE + pyOff);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.ellipse(0, 10-pyOff, 8, 4, 0, 0, Math.PI*2); ctx.fill();

                // Body
                ctx.fillStyle = COLORS.player;
                ctx.shadowBlur = 15; ctx.shadowColor = COLORS.player;
                ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(-5, -2, 3, 2); ctx.fillRect(2, -2, 3, 2);
                
                ctx.restore();

                // Particles
                this.particles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    if(p.life <= 0) this.particles.splice(i, 1);
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;

                ctx.restore();

                if(this.state === 'hit') {
                    ctx.fillStyle = 'rgba(255,0,0,0.2)';
                    ctx.fillRect(0,0,canvas.width,canvas.height);
                }
            },

            gameLoop() {
                if(this.state === 'playing') {
                    const dt = 0.016;
                    this.updateGuards(dt);
                    this.checkVision();
                    if(this.player.hopAnimation > 0) {
                        this.player.hopAnimation -= 0.05;
                        if(this.player.hopAnimation < 0) this.player.hopAnimation = 0;
                    }
                }
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        };

        game.init();
    </script>
</body>
</html>
