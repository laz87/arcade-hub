        },
        {

            categories: [
                {

                    difficulty: "yellow"
                },
                {

                    words: ["CHOPPER", "ROBIN", "LUFFY", "BROOK"],

                },
                {

                    words: ["BARTOLOMEO", "HAJRUDIN", "LEO", "CAVENDISH"],
                    difficulty: "blue"
                },
                {

                    words: ["GOING MERRY", "THOUSAND SUNNY", "MINI MERRY", "SHARK SUBMERGE"],

                }
            ]
        },
        {
            name: "The Yonko",
            categories: [
                {
                    name: "Original Yonko",
                    words: ["WHITEBEARD", "SHANKS", "KAIDO", "BIG MOM"],
                    difficulty: "yellow"
                },
                {
                    name: "New Generation Yonko",
                    words: ["BLACKBEARD", "LUFFY", "BUGGY", "SHANKS"],
                    difficulty: "green"
                },
                {
                    name: "Yonko Commanders",
                    words: ["ZORO", "JESUS BURGESS", "CROCODILE", "BECKMAN"],
                    difficulty: "blue"
                },
                {
                    name: "Yonko Territory",
                    words: ["HACHINOSU", "ELBAF", "FISH-MAN ISLAND", "EMPTEE BLUFFS"],
                    difficulty: "purple"
                }
            ]
        }
    ];

    // Replace default puzzles with Swahili vocabulary puzzles (UI in English; content in Swahili with English translations)
    const swPuzzles = [
        {
            name: "Beginner Nouns",
            categories: [
                { name: "Family", words: ["MAMA (Mother)", "BABA (Father)", "RAFIKI (Friend)", "MTOTO (Child)"], difficulty: "yellow" },
                { name: "Places", words: ["SHULE (School)", "SOKO (Market)", "NYUMBA (House)", "HOSPITALI (Hospital)"], difficulty: "green" },
                { name: "Animals", words: ["MBWA (Dog)", "PAKA (Cat)", "NDEGE (Bird)", "SAMAKI (Fish)"], difficulty: "blue" },
                { name: "Colors", words: ["NYEKUNDU (Red)", "KIJANI (Green)", "MANJANO (Yellow)", "SAMAWATI (Blue)"], difficulty: "purple" }
            ]
        },
        {
            name: "Daily Basics",
            categories: [
                { name: "Common Verbs", words: ["KULA (Eat)", "KUNYWA (Drink)", "KUSOMA (Read)", "KUANDIKA (Write)"], difficulty: "yellow" },
                { name: "Numbers", words: ["MOJA (One)", "MBILI (Two)", "TATU (Three)", "NNE (Four)"], difficulty: "green" },
                { name: "Body Parts", words: ["MKONO (Arm)", "MGUU (Leg)", "JICHO (Eye)", "SIKIO (Ear)"], difficulty: "blue" },
                { name: "Days", words: ["JUMATATU (Monday)", "JUMANNE (Tuesday)", "JUMATANO (Wednesday)", "ALHAMISI (Thursday)"], difficulty: "purple" }
            ]
        },
        {
            name: "Everyday Life",
            categories: [
                { name: "Food & Drink", words: ["MKATE (Bread)", "MAZIWA (Milk)", "MAJI (Water)", "MCHELE (Rice)"], difficulty: "yellow" },
                { name: "Directions", words: ["KUSHOTO (Left)", "KULIA (Right)", "MBELE (Front)", "NYUMA (Back)"], difficulty: "green" },
                { name: "Weather", words: ["MVUA (Rain)", "JUA (Sun)", "UPEPO (Wind)", "BARIDI (Cold)"], difficulty: "blue" },
                { name: "Occupations", words: ["MWALIMU (Teacher)", "DAKTARI (Doctor)", "MKULIMA (Farmer)", "POLISI (Police Officer)"], difficulty: "purple" }
            ]
        },
        {
            name: "Home & Garden",
            categories: [
                { name: "Furniture", words: ["KITI (Chair)", "MEZA (Table)", "KITANDA (Bed)", "KABATI (Cupboard)"], difficulty: "yellow" },
                { name: "Kitchenware", words: ["SAHANI (Plate)", "KIJIKO (Spoon)", "UMA (Fork)", "KIKOMBE (Cup)"], difficulty: "green" },
                { name: "Garden", words: ["UA (Flower)", "MTI (Tree)", "MAJANI (Grass)", "UDONGO (Soil)"], difficulty: "blue" },
                { name: "Cleaning", words: ["UFAGIO (Broom)", "SABUNI (Soap)", "MAJI (Water)", "TAULO (Towel)"], difficulty: "purple" }
            ]
        },
        {
            name: "Travel & Transport",
            categories: [
                { name: "Vehicles", words: ["GARI (Car)", "BASI (Bus)", "BAISKELI (Bicycle)", "PIKIPIKI (Motorcycle)"], difficulty: "yellow" },
                { name: "Transport Hubs", words: ["UWANJA WA NDEGE (Airport)", "KITUO CHA BASI (Bus Station)", "BANDARI (Harbor)", "STESHENI (Station)"], difficulty: "green" },
                { name: "Nature/Travel", words: ["MLIMA (Mountain)", "KISIWA (Island)", "PWANI (Coast)", "MSITU (Forest)"], difficulty: "blue" },
                { name: "Essentials", words: ["PASIPOTI (Passport)", "TIKETI (Ticket)", "PESA (Money)", "MKANDA (Belt/Strap)"], difficulty: "purple" }
            ]
        }
    ];
    puzzles.splice(0, puzzles.length, ...swPuzzles);

    const gridEl = document.getElementById('grid');
    const mistakesEl = document.getElementById('mistakes');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const deselectBtn = document.getElementById('deselect-all-btn');
    const submitBtn = document.getElementById('submit-btn');
    const feedbackEl = document.getElementById('feedback');
    const victoryMessageEl = document.getElementById('victory-message');
    const victoryCategoryEl = document.getElementById('victory-category');
    const levelSelectEl = document.getElementById('level-select');
    const scoreEl = document.getElementById('score');
    let score = 0;

    const DIFFICULTY_COLORS = {
        yellow: "#f9df6d",
        green: "#a0c35a",
        blue: "#b0c4ef",
        purple: "#ba81c5"
    };

    let currentPuzzle;
    let currentPuzzleIndex = 0;
    let gridWords = [];
    let selectedItems = [];
    let mistakes = 0;
    let gameOver = false;
    let foundCategories = [];

    function initGame(puzzleIndex = -1) {
        gameOver = false;
        mistakes = 0;
        selectedItems = [];
        foundCategories = [];
        victoryMessageEl.style.display = 'none';
        mistakesEl.style.display = 'flex';
        feedbackEl.textContent = '';
        score = 0;
        updateScoreUI();

        // Remove any play-again or next-puzzle buttons from previous games
        const existingNextBtn = document.getElementById('next-puzzle-btn');
        if (existingNextBtn) existingNextBtn.remove();
        const existingPlayAgainBtn = document.getElementById('play-again-btn');
        if (existingPlayAgainBtn) existingPlayAgainBtn.remove();

        // Select puzzle
        if (puzzleIndex === -1) {
            currentPuzzleIndex = Math.floor(Math.random() * puzzles.length);
        } else {
            currentPuzzleIndex = puzzleIndex;
        }
        currentPuzzle = puzzles[currentPuzzleIndex];
        
        // Update level selector UI
        updateLevelSelectUI();
        
        // Flatten all words from all 4 categories
        gridWords = currentPuzzle.categories.flatMap(cat => cat.words);
        gridWords = shuffle([...gridWords]);

        renderGrid();
        updateMistakesUI();
        submitBtn.disabled = true;
        shuffleBtn.disabled = false;
        deselectBtn.disabled = true;
    }

    function initLevelSelect() {
        levelSelectEl.innerHTML = '';
        puzzles.forEach((puzzle, index) => {
            const btn = document.createElement('button');
            btn.className = `level-btn ${index === currentPuzzleIndex ? 'active' : ''}`;
            btn.textContent = puzzle.name;
            btn.onclick = () => {
                if (index !== currentPuzzleIndex) {
                    initGame(index);
                }
            };
            levelSelectEl.appendChild(btn);
        });
    }

    function updateLevelSelectUI() {
        const buttons = levelSelectEl.querySelectorAll('.level-btn');
        buttons.forEach((btn, index) => {
            if (index === currentPuzzleIndex) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    function renderGrid() {
        gridEl.innerHTML = '';

        // First, render the solved categories at the top
        foundCategories.forEach(cat => {
            const catRow = document.createElement('div');
            catRow.className = 'category-row';
            catRow.style.backgroundColor = DIFFICULTY_COLORS[cat.difficulty];
            
            const nameEl = document.createElement('div');
            nameEl.className = 'category-name';
            nameEl.textContent = cat.name;
            
            const wordsEl = document.createElement('div');
            wordsEl.className = 'category-words';
            wordsEl.textContent = cat.words.join(', ');
            
            catRow.appendChild(nameEl);
            catRow.appendChild(wordsEl);
            gridEl.appendChild(catRow);
        });

        // Then render the remaining grid items
        gridWords.forEach(word => {
            const itemEl = document.createElement('div');
            itemEl.classList.add('grid-item');
            itemEl.textContent = word;
            itemEl.dataset.word = word;

            if (selectedItems.includes(word)) {
                itemEl.classList.add('selected');
            }

            itemEl.addEventListener('click', () => onItemClick(itemEl));
            gridEl.appendChild(itemEl);
        });
    }

    function onItemClick(itemEl) {
        if (gameOver) return;
        const word = itemEl.dataset.word;

        if (selectedItems.includes(word)) {
            selectedItems = selectedItems.filter(i => i !== word);
            itemEl.classList.remove('selected');
        } else {
            if (selectedItems.length < 4) {
                selectedItems.push(word);
                itemEl.classList.add('selected');
            }
        }
        submitBtn.disabled = selectedItems.length !== 4;
        deselectBtn.disabled = selectedItems.length === 0;
    }

    function handleDeselectAll() {
        selectedItems = [];
        document.querySelectorAll('.grid-item.selected').forEach(el => el.classList.remove('selected'));
        submitBtn.disabled = true;
        deselectBtn.disabled = true;
    }

    function handleSubmit() {
        const guess = selectedItems.slice().sort();
        let matchedCategory = null;

        for (const cat of currentPuzzle.categories) {
            const catWords = cat.words.slice().sort();
            if (JSON.stringify(guess) === JSON.stringify(catWords)) {
                matchedCategory = cat;
                break;
            }
        }

        if (matchedCategory) {
            handleCorrectGuess(matchedCategory);
        } else {
            handleIncorrectGuess();
        }
    }

    function handleCorrectGuess(category) {
        showFeedback("Correct!");
        foundCategories.push(category);
        score += 25;
        updateScoreUI();
        
        // Remove found words from gridWords
        gridWords = gridWords.filter(word => !category.words.includes(word));
        selectedItems = [];
        
        renderGrid();
        submitBtn.disabled = true;
        deselectBtn.disabled = true;

        if (foundCategories.length === 4) {
            gameOver = true;
            showVictory();
        }
    }

    function handleIncorrectGuess() {
        mistakes++;
        updateMistakesUI();
        score = Math.max(0, score - 5);
        updateScoreUI();
        
        // Shake the incorrect tiles
        const selectedElements = document.querySelectorAll('.grid-item.selected');
        selectedElements.forEach(el => {
            el.classList.add('shake');
            setTimeout(() => {
                el.classList.remove('shake');
            }, 500);
        });

        // NYT Connections doesn't immediately clear selection on incorrect guess if not game over
        // But it vibrates and waits. Usually user deselects. 
        // Let's check for "one away" logic which is common in Connections
        checkOneAway();

        if (mistakes >= 4) {
            gameOver = true;
            showFeedback("Better luck next time!");
            revealRemainingAnswers();
        }
    }

    function checkOneAway() {
        const guess = selectedItems.slice().sort();
        let maxMatches = 0;
        for (const cat of currentPuzzle.categories) {
            if (foundCategories.includes(cat)) continue;
            const matches = guess.filter(word => cat.words.includes(word)).length;
            if (matches > maxMatches) maxMatches = matches;
        }
        
        if (maxMatches === 3) {
            showFeedback("One away...");
        } else {
            showFeedback("Not a connection.");
        }
    }

    function showVictory() {
        victoryCategoryEl.textContent = "Great Job!";
        victoryMessageEl.querySelector('p').textContent = "You found all connections!";
        victoryMessageEl.style.display = 'block';
        shuffleBtn.disabled = true;
        mistakesEl.style.display = 'none';

        if (!document.getElementById('next-puzzle-btn') && currentPuzzleIndex < puzzles.length - 1) {
            const nextBtn = document.createElement('button');
            nextBtn.id = 'next-puzzle-btn';
            nextBtn.textContent = 'Next Puzzle';
            nextBtn.classList.add('btn');
            nextBtn.style.marginTop = '10px';
            nextBtn.onclick = () => initGame(currentPuzzleIndex + 1);
            victoryMessageEl.appendChild(nextBtn);
        }

        if (!document.getElementById('play-again-btn')) {
            const playAgainBtn = document.createElement('button');
            playAgainBtn.id = 'play-again-btn';
            playAgainBtn.textContent = 'Play Again';
            playAgainBtn.classList.add('btn');
            playAgainBtn.style.marginTop = '10px';
            playAgainBtn.onclick = () => initGame(currentPuzzleIndex);
            victoryMessageEl.appendChild(playAgainBtn);
        }
    }

    function revealRemainingAnswers() {
        const remainingCats = currentPuzzle.categories.filter(cat => !foundCategories.includes(cat));
        
        // Show a message to the user
        victoryCategoryEl.textContent = "Game Over";
        victoryMessageEl.querySelector('p').textContent = "Revealing the remaining answers...";
        victoryMessageEl.style.display = 'block';

        // Use a timeout to reveal each category one by one
        let delay = 1000;
        remainingCats.forEach((cat, index) => {
            setTimeout(() => {
                foundCategories.push(cat);
                gridWords = gridWords.filter(word => !cat.words.includes(word));
                renderGrid();
                
                if (index === remainingCats.length - 1) {
                    victoryCategoryEl.textContent = "Better luck next time!";
                    victoryMessageEl.querySelector('p').textContent = "Click to try again or move to next.";
                    
                    if (!document.getElementById('next-puzzle-btn') && currentPuzzleIndex < puzzles.length - 1) {
                        const nextBtn = document.createElement('button');
                        nextBtn.id = 'next-puzzle-btn';
                        nextBtn.textContent = 'Next Puzzle';
                        nextBtn.classList.add('btn');
                        nextBtn.style.marginTop = '10px';
                        nextBtn.onclick = () => initGame(currentPuzzleIndex + 1);
                        victoryMessageEl.appendChild(nextBtn);
                    }

                    if (!document.getElementById('play-again-btn')) {
                        const playAgainBtn = document.createElement('button');
                        playAgainBtn.id = 'play-again-btn';
                        playAgainBtn.textContent = 'Try Again';
                        playAgainBtn.classList.add('btn');
                        playAgainBtn.style.marginTop = '10px';
                        playAgainBtn.onclick = () => initGame(currentPuzzleIndex);
                        victoryMessageEl.appendChild(playAgainBtn);
                    }
                }
            }, delay * (index + 1));
        });

        submitBtn.disabled = true;
        shuffleBtn.disabled = true;
        deselectBtn.disabled = true;
    }

    function updateMistakesUI() {
        const dots = mistakesEl.querySelectorAll('.mistake-dot');
        for (let i = 0; i < dots.length; i++) {
            // Fill dots from left to right as mistakes increase
            dots[i].style.backgroundColor = i < mistakes ? 'var(--destructive)' : '#d1d5db';
        }
    }
    
    function updateScoreUI() {
        if (scoreEl) scoreEl.textContent = `Score: ${score}`;
    }
    
    function showFeedback(message) {
        feedbackEl.textContent = message;
        // Keep "One away" or "Not a connection" for a while
        setTimeout(() => { 
            if (feedbackEl.textContent === message && !gameOver) feedbackEl.textContent = ''; 
        }, 2000);
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    shuffleBtn.addEventListener('click', () => {
        gridWords = shuffle(gridWords);
        renderGrid();
    });

    deselectBtn.addEventListener('click', handleDeselectAll);

    submitBtn.addEventListener('click', handleSubmit);

    initLevelSelect();
    initGame();
</script>
