<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Mahjong</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0d0221;
            --surface: #1a1a2e;
            --accent: #f2d349;        /* Main yellow */
            --primary: #e91e63;        /* Pink */
            --secondary: #2196f3;      /* Blue */
            --text: #ffffff;
            --success: #4caf50;        /* Green */
            --sakura: #ffb7c5; 
        }
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    
    body {
        font-family: 'Poppins', sans-serif;
        background: var(--background);
        color: var(--text);
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    #game-container {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 10px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
    }

    .board-wrapper {
        flex: 1;
        position: relative;
        background: var(--surface);
        border: 3px solid var(--accent);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(242, 211, 73, 0.1);
        overflow: hidden;
        min-height: 0;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    .ui-top {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 15px 0;
        gap: 5px;
    }

    .game-title {
        font-family: 'Bangers', cursive;
        font-size: 3em;
        color: var(--accent);
        text-shadow: 3px 3px 0px rgba(0,0,0,0.5), 0 0 20px rgba(242, 211, 73, 0.3);
        letter-spacing: 2px;
        line-height: 1;
    }

    .game-subtitle {
        font-family: 'Poppins', sans-serif;
        font-size: 0.9em;
        color: var(--secondary);
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: bold;
    }

    .timer-display {
        position: absolute;
        top: 20px;
        right: 20px;
        font-family: 'Bangers', cursive;
        font-size: 1.5em;
        color: var(--accent);
    }

    .layout-selector {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 10px 0;
        margin-bottom: 15px;
    }

    .level-btn {
        flex: 0 1 auto;
        min-width: 100px;
        background: rgba(255,255,255,0.05);
        border: 2px solid var(--accent);
        color: var(--accent);
        padding: 8px 20px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 1.1em;
        font-family: 'Bangers', cursive;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .level-btn:hover {
        background: rgba(242, 211, 73, 0.1);
        transform: translateY(-2px);
    }

    .level-btn.active {
        background: var(--accent);
        color: var(--background);
        box-shadow: 0 0 20px var(--accent);
    }

    .info-bar {
        display: flex;
        justify-content: space-around;
        padding: 10px;
        font-size: 1em;
        color: var(--accent);
        background: rgba(26, 26, 46, 0.8);
        border-radius: 10px;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .info-item span {
        color: var(--text);
    }

    .controls {
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        gap: 15px;
        padding: 20px 0;
    }

    .btn {
        background: transparent;
        border: 2px solid var(--accent);
        color: var(--accent);
        padding: 10px 25px;
        border-radius: 20px;
        cursor: pointer;
        font-family: 'Bangers', cursive;
        font-size: 1.3em;
        transition: all 0.3s;
        box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .btn:hover {
        background: var(--accent);
        color: var(--background);
        box-shadow: 0 0 15px var(--accent);
        transform: scale(1.05);
    }
    @media (max-width: 600px) {
        .game-title { font-size: 2em; }
        .level-btn { min-width: 80px; font-size: 0.9em; padding: 6px 12px; }
        .timer-display { position: static; margin-top: 10px; }
        .info-bar { font-size: 0.8em; flex-wrap: wrap; gap: 5px; }
        .btn { padding: 8px 16px; font-size: 1.1em; }
    }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-top">
        <h1 class="game-title">Anime Mahjong</h1>
        <div class="timer-display" id="timer">0:00</div>
    </div>

    <div class="layout-selector" id="layoutSelector"></div>

    <div class="info-bar">
        <div class="info-item">Layout: <span id="layoutName">-</span></div>
        <div class="info-item">Difficulty: <span id="difficulty">-</span></div>
        <div class="info-item">Tiles: <span id="count">0</span>/<span id="totalTiles">0</span></div>
    </div>

    <div class="board-wrapper" id="canvasParent">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
        <button class="btn" onclick="initGame()">Restart</button>
        <button class="btn" onclick="shuffle()">Shuffle</button>
        <button class="btn" onclick="giveHint()">Hint</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    const parent = canvas.parentElement;
    canvas.width = parent.clientWidth;
    canvas.height = parent.clientHeight;

    if (tiles.length === 0) return;

    const maxX = Math.max(...tiles.map(t => t.x)) + 1;
    const maxY = Math.max(...tiles.map(t => t.y)) + 1;

    const tileW = 0.85; 
    const availableW = canvas.width / (maxX * tileW + 0.5);
    const availableH = canvas.height / (maxY + 0.5);
    
    world.scale = Math.min(availableW, availableH) * 0.95; 

    world.offX = (canvas.width - (maxX * world.scale * tileW)) / 2;
    world.offY = (canvas.height - (maxY * world.scale)) / 2;
}

function shuffle() {
    const activeTiles = tiles.filter(t => !t.matched);
    if (activeTiles.length === 0) return;

    const remainingSymbols = activeTiles.map(t => t.symbol);

    for (let i = remainingSymbols.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remainingSymbols[i], remainingSymbols[j]] = [remainingSymbols[j], remainingSymbols[i]];
    }

    activeTiles.forEach((tile, index) => {
        tile.symbol = remainingSymbols[index];
    });

    selected = null;
}

canvas.addEventListener('pointerdown', handleClick);

// --- MODIFICATION START ---

// REMOVED: The old emoji array
// const symbols = ['🌸', '🦊', '🌀', '⚔️', '👒', '🏮', '🌩️', '🏯', '👁️', '👻'];

// NEW: An array of your image file names.
// Place these image files in the same folder as your HTML file.
const imagePaths = [
    '1.webp', '2.webp', '3.webp', '4.webp', 
    '5.webp', '6.webp', '7.webp', '8.webp', 
    '9.webp', '10.webp'
];

// NEW: An object to hold the preloaded image objects.
const tileImages = {};

const layouts = [
    {
        name: "Pyramid",
        difficulty: "Easy",
        generate: () => {
            const l = [];
            for(let z=0; z<3; z++) {
                const dim = 5 - z;
                for(let x=0; x<dim; x++) {
                    for(let y=0; y<dim; y++) {
                        l.push({ x: x + (z*0.5) + 2, y: y + (z*0.5) + 1, z: z });
                    }
                }
            }
            return l;
        }
    },
    {
        name: "Turtle",
        difficulty: "Medium",
        generate: () => {
            const l = [];
            // Layer 0: 12x8 approx
            for(let x=0; x<12; x++) {
                for(let y=0; y<8; y++) {
                    if ((x > 0 && x < 11 && y > 0 && y < 7) || 
                        (x === 0 && y >= 3 && y <= 4) || 
                        (x === 11 && y >= 3 && y <= 4) ||
                        (y === 0 && x >= 5 && x <= 6) ||
                        (y === 7 && x >= 5 && x <= 6)) {
                        l.push({x, y, z: 0});
                    }
                }
            }
            // Layer 1: 6x4
            for(let x=3; x<9; x++) {
                for(let y=2; y<6; y++) {
                    l.push({x: x+0.5, y: y+0.5, z: 1});
                }
            }
            // Layer 2: 4x2
            for(let x=4; x<8; x++) {
                for(let y=3; y<5; y++) {
                    l.push({x: x+1, y: y+1, z: 2});
                }
            }
            // Layer 3: 2x1
            l.push({x: 6.5, y: 4.5, z: 3}, {x: 7.5, y: 4.5, z: 3});
            return l;
        }
    },
    {
        name: "Tower",
        difficulty: "Hard",
        generate: () => {
            const l = [];
            for(let z=0; z<5; z++) {
                const size = 6 - z;
                for(let x=0; x<size; x++) {
                    for(let y=0; y<2; y++) {
                        l.push({x: x + z*0.5 + 3, y: y + z*0.5 + 2, z: z});
                        l.push({x: y + z*0.5 + 3, y: x + z*0.5 + 2, z: z});
                    }
                }
            }
            return l;
        }
    },
    {
        name: "Dragon",
        difficulty: "Hard",
        generate: () => {
            const l = [];
            for(let i=0; i<14; i++) {
                l.push({x: i, y: 4, z: 0});
                l.push({x: i, y: 5, z: 0});
                if(i > 2 && i < 11) {
                    l.push({x: i, y: 3, z: 0}, {x: i, y: 6, z: 0});
                    l.push({x: i+0.5, y: 4.5, z: 1});
                }
            }
            l.push({x: 0, y: 3, z: 0}, {x: 0, y: 2, z: 0}, {x: 1, y: 2, z: 0}); // Head
            l.push({x: 13, y: 6, z: 0}, {x: 14, y: 6, z: 0}, {x: 14, y: 7, z: 0}); // Tail
            return l;
        }
    },
    {
        name: "Four Bridges",
        difficulty: "Medium",
        generate: () => {
            const l = [];
            const centers = [{x:2, y:2}, {x:9, y:2}, {x:2, y:7}, {x:9, y:7}];
            centers.forEach(c => {
                for(let x=0; x<3; x++) {
                    for(let y=0; y<3; y++) {
                        l.push({x: c.x + x, y: c.y + y, z: 0});
                        if(x === 1 && y === 1) l.push({x: c.x + x, y: c.y + y, z: 1});
                    }
                }
            });
            // Bridges
            for(let x=5; x<9; x++) { l.push({x, y:3, z:0}, {x, y:8, z:0}); }
            for(let y=4; y<7; y++) { l.push({x:3, y, z:0}, {x:10, y, z:0}); }
            return l;
        }
    },
    {
        name: "Cat",
        difficulty: "Easy",
        generate: () => {
            const l = [];
            // Body
            for(let x=3; x<9; x++) {
                for(let y=3; y<8; y++) {
                    l.push({x, y, z: 0});
                    if(x > 4 && x < 7 && y > 4 && y < 7) l.push({x, y, z: 1});
                }
            }
            // Ears
            l.push({x: 3, y: 2, z: 0}, {x: 4, y: 2, z: 0});
            l.push({x: 7, y: 2, z: 0}, {x: 8, y: 2, z: 0});
            // Tail
            l.push({x: 9, y: 7, z: 0}, {x: 10, y: 7, z: 0}, {x: 11, y: 6, z: 0});
            return l;
        }
    },
    {
        name: "Crab",
        difficulty: "Medium",
        generate: () => {
            const l = [];
            // Body
            for(let x=4; x<10; x++) {
                for(let y=3; y<7; y++) {
                    l.push({x, y, z: 0});
                    l.push({x: x+0.2, y: y+0.2, z: 1});
                }
            }
            // Claws
            l.push({x: 2, y: 2, z: 0}, {x: 3, y: 2, z: 0}, {x: 2, y: 3, z: 0});
            l.push({x: 11, y: 2, z: 0}, {x: 10, y: 2, z: 0}, {x: 11, y: 3, z: 0});
            // Legs
            for(let i=0; i<3; i++) {
                l.push({x: 3, y: 4+i, z: 0}, {x: 11, y: 4+i, z: 0});
            }
            return l;
        }
    },
    {
        name: "Spider",
        difficulty: "Hard",
        generate: () => {
            const l = [];
            // Body
            for(let x=5; x<9; x++) {
                for(let y=3; y<7; y++) {
                    l.push({x, y, z: 0}, {x, y, z: 1});
                }
            }
            // Legs
            const legs = [[-1,-1], [-1,0], [-1,1], [1,-1], [1,0], [1,1]];
            legs.forEach(leg => {
                for(let i=1; i<4; i++) {
                    l.push({x: 7 + (leg[0]*i*1.5), y: 5 + (leg[1]*i*1.5), z: 0});
                }
            });
            return l;
        }
    }
];

let currentLayoutIndex = 0;
let tiles = [];
let selected = null;
let world = { w: 0, h: 0, scale: 1, offX: 0, offY: 0 };
let startTime = Date.now();
let timerInterval;

function initLayoutSelector() {
    const selector = document.getElementById('layoutSelector');
    layouts.forEach((layout, index) => {
        const btn = document.createElement('button');
        btn.className = `level-btn ${index === currentLayoutIndex ? 'active' : ''}`;
        btn.textContent = layout.name;
        btn.onclick = () => {
            currentLayoutIndex = index;
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initGame();
        };
        selector.appendChild(btn);
    });
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('timer').innerText = `${m}:${s.toString().padStart(2, '0')}`;
}

function giveHint() {
    const active = tiles.filter(t => !t.matched);
    const free = active.filter(t => isFree(t));
    
    for (let i = 0; i < free.length; i++) {
        for (let j = i + 1; j < free.length; j++) {
            if (free[i].symbol === free[j].symbol) {
                selected = free[i];
                // Visual feedback for the hint
                const r2 = getTileRect(free[j]);
                ctx.strokeStyle = '#4caf50'; // Use success green for hint
                ctx.lineWidth = 5;
                ctx.strokeRect(r2.x, r2.y, r2.w, r2.h);
                return;
            }
        }
    }
}

function checkWin() {
    if (tiles.every(t => t.matched)) {
        clearInterval(timerInterval);
        setTimeout(() => {
            alert(`Congratulations! You cleared the board in ${document.getElementById('timer').innerText}!`);
            initGame();
        }, 500);
    }
}

function initGame() {
    const layoutData = layouts[currentLayoutIndex];
    document.getElementById('layoutName').innerText = layoutData.name;
    document.getElementById('difficulty').innerText = layoutData.difficulty;

    let layout = layoutData.generate();

    if(layout.length % 2 !== 0) layout.pop();
    
    let deck = [];
    for(let i=0; i<layout.length/2; i++) {
        const s = imagePaths[i % imagePaths.length];
        deck.push(s, s);
    }
    deck.sort(() => Math.random() - 0.5);

    tiles = layout.map((pos, i) => ({
        ...pos, symbol: deck[i], matched: false, id: i
    }));

    document.getElementById('totalTiles').innerText = tiles.length;
    document.getElementById('count').innerText = tiles.length;
    
    startTime = Date.now();
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
    
    selected = null;
    resize();
}

function getTileRect(t) {
    const sz = world.scale;
    const depth = t.z * (sz * 0.1);
    return {
        x: world.offX + (t.x * sz * 0.85) - depth,
        y: world.offY + (t.y * sz) - depth,
        w: sz * 0.8,
        h: sz
    };
}

function handleClick(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
    const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
    const mouseX = (clientX - rect.left) * (canvas.width / rect.width);
    const mouseY = (clientY - rect.top) * (canvas.height / rect.height);
    let clickedTile = null;
    const active = tiles.filter(t => !t.matched).sort((a,b) => b.z - a.z);

    for (let t of active) {
        const r = getTileRect(t);
        if (mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h) {
            clickedTile = t;
            break; 
        }
    }

    if (clickedTile && isFree(clickedTile)) {
        if (selected && selected !== clickedTile && selected.symbol === clickedTile.symbol) {
            clickedTile.matched = selected.matched = true;
            selected = null;
            document.getElementById('count').innerText = tiles.filter(t => !t.matched).length;
            checkWin();
        } else {
            selected = clickedTile;
        }
    } else {
        selected = null;
    }
}

function isFree(t) {
    if (t.matched) return false;
    const onTop = tiles.some(o => !o.matched && o.z === t.z + 1 && Math.abs(o.x - t.x) < 0.6 && Math.abs(o.y - t.y) < 0.6);
    if (onTop) return false;
    const left = tiles.some(o => !o.matched && o.z === t.z && o.x === t.x - 1 && Math.abs(o.y - t.y) < 0.2);
    const right = tiles.some(o => !o.matched && o.z === t.z && o.x === t.x + 1 && Math.abs(o.y - t.y) < 0.2);
    return !left || !right;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const renderList = tiles.filter(t => !t.matched).sort((a,b) => a.z - b.z || a.x - b.x);
    
    renderList.forEach(t => {
        const r = getTileRect(t);
        const free = isFree(t);

        // 3D Side Shadow
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(r.x + (world.scale*0.06), r.y + (world.scale*0.06), r.w, r.h);

        // Tile Face
        const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
        const sakuraColor = getComputedStyle(document.documentElement).getPropertyValue('--sakura').trim();
        const successColor = getComputedStyle(document.documentElement).getPropertyValue('--success').trim();
        
        ctx.fillStyle = (selected === t) ? sakuraColor : '#ffffff';
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = (selected === t) ? Math.max(2, world.scale * 0.05) : Math.max(1, world.scale * 0.03);
        
        ctx.beginPath();
        ctx.roundRect(r.x, r.y, r.w, r.h, world.scale * 0.1);
        ctx.fill();
        ctx.stroke();

        // --- MODIFICATION START: Draw Image instead of Emoji ---
        
        // Get the preloaded image for this tile's symbol (which is an image path)
        const img = tileImages[t.symbol];
        if (img) {
            // Add some padding so the image doesn't touch the tile edges
            const padding = r.w * 0.15;
            ctx.drawImage(img, r.x + padding, r.y + padding, r.w - padding * 2, r.h - padding * 2);
        }

        // --- MODIFICATION END ---
        
        // NEW: If tile is not free, draw a semi-transparent overlay on top
        if (!free) {
            ctx.fillStyle = 'rgba(50, 50, 50, 0.7)'; // Dark gray overlay
            ctx.beginPath();
            ctx.roundRect(r.x, r.y, r.w, r.h, world.scale * 0.1);
            ctx.fill();
        }
    });

    requestAnimationFrame(draw);
}

// NEW: Function to preload all images before starting the game
function preloadImages(paths, callback) {
    let loadedCount = 0;
    paths.forEach(path => {
        const img = new Image();
        img.src = path;
        img.onload = () => {
            loadedCount++;
            tileImages[path] = img; // Store the loaded image object
            if (loadedCount === paths.length) {
                callback(); // All images are loaded, start the game
            }
        };
        img.onerror = () => {
            console.error(`Failed to load image: ${path}`);
            // You might want to handle this error, e.g., by stopping the game
        }
    });
}

// MODIFIED: Game startup sequence
window.addEventListener('load', () => {
    // Show a loading message while images are preloading
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.font = '24px "Segoe UI"';
    ctx.fillText('Loading Assets...', canvas.width / 2, canvas.height / 2);

    preloadImages(imagePaths, () => {
        initLayoutSelector();
        initGame();
        draw();
    });
});
window.addEventListener('resize', resize);
</script>
</body>
