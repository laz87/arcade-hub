<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Star</title>
    <style>
        :root {
            --neon-cyan: #00FFFF;
            --dark-blue-top: #001133;
            --dark-blue-bottom: #003366;
            --font-main: 'Orbitron', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-main);
            color: var(--neon-cyan);
        }

        #game-container {
            position: relative;
            width: 380px;
            height: 800px;
            max-width: 100vw;
            max-height: 100vh;
            background: linear-gradient(to bottom, var(--dark-blue-top), var(--dark-blue-bottom));
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-cyan);
            letter-spacing: 4px;
        }

        .score-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .game-over-title {
            font-size: 40px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .final-stats {
            margin-bottom: 40px;
            font-size: 24px;
            line-height: 1.5;
        }

        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            width: 80px;
            height: 80px;
            background-color: var(--neon-cyan);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn svg {
            width: 40px;
            height: 40px;
            fill: #001133;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background-color: var(--neon-cyan);
            border-radius: 8px;
            display: none; /* Shown in game over */
        }

        .sound-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            margin-top: 40px;
            background-color: var(--neon-cyan);
            border-radius: 8px;
            display: flex;
            z-index: 20;
            pointer-events: auto;
        }

        .sound-btn svg {
            width: 30px;
            height: 30px;
        }

        .tap-to-start {
            font-size: 20px;
            margin-top: 50px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .high-score-label {
            margin-top: 10px;
            font-size: 18px;
            opacity: 0.8;
        }

        .share-text {
            margin-top: 20px;
            font-size: 16px;
            letter-spacing: 2px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <!-- Title Screen -->
        <div id="title-screen" class="screen active">
            <h1>FAST STAR</h1>
            <div id="start-high-score" class="high-score-label"></div>
            <p class="tap-to-start">CLICK/TAP TO START</p>
        </div>

        <!-- Playing Screen (minimal UI) -->
        <div id="playing-screen" class="screen">
            <div id="current-score" class="score-display">SCORE: 0</div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <h2 class="game-over-title">GAME OVER</h2>
            <div class="final-stats">
                <p id="final-score">Score: 0</p>
                <p id="high-result">HIGH RESULT: 0</p>
                <p class="share-text">SHARE YOUR SCORE!</p>
            </div>
            <div class="button-container">
                <button id="restart-btn" class="btn" title="Restart">
                    <svg viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Top Left Home Button (visible in Game Over) -->
    <button id="home-btn" class="btn home-btn" title="Home">
        <svg viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
    </button>

    <!-- Top Right Sound Toggle -->
    <button id="sound-btn" class="btn sound-btn" title="Toggle Sound">
        <svg id="sound-on-icon" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.03C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg>
        <svg id="sound-off-icon" viewBox="0 0 24 24" style="display:none;"><path d="M12,4L9.91,6.09L12,8.18M4.27,3L3,4.27L7.73,9H3V15H7L12,20V13.27L16.25,17.53C15.58,18.04 14.83,18.46 14,18.7V20.77C15.38,20.45 16.63,19.82 17.68,18.96L19.73,21L21,19.73L12,10.73M19,12C19,12.94 18.8,13.82 18.46,14.64L19.97,16.15C20.62,14.91 21,13.5 21,12C21,7.72 18.03,4.14 14,3.23V5.29C16.89,6.15 19,8.83 19,12M16.5,12C16.5,10.23 15.5,8.71 14,7.97V10.18L16.45,12.63C16.48,12.43 16.5,12.22 16.5,12Z"/></svg>
    </button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    // Game Constants
    const BASE_WIDTH = 380;
    const BASE_HEIGHT = 800;
    const PLAYER_START_WIDTH = 40;
    const PLAYER_START_HEIGHT = 80;
    const PLAYER_STROKE = 3;
    const STAR_SPEED_INITIAL = 3;
    const STAR_SPAWN_INTERVAL_INITIAL = 1500;
    const MIN_SPAWN_INTERVAL = 500;
    const FPS = 60;

    // Game State
    let gameState = 'TITLE'; // TITLE, PLAYING, GAMEOVER
    let score = 0;
    let highResult = localStorage.getItem('fastStarHighScore') || 0;
    let lastTime = 0;
    let spawnTimer = 0;
    let scoreTimer = 0;
    let currentSpawnInterval = STAR_SPAWN_INTERVAL_INITIAL;
    let currentStarSpeed = STAR_SPEED_INITIAL;
    let mouseX = BASE_WIDTH / 2;
    let isMuted = false;
    let screenShake = 0;

    // Classes
    class Player {
        constructor() {
            this.width = PLAYER_START_WIDTH;
            this.height = PLAYER_START_HEIGHT;
            this.x = BASE_WIDTH / 2 - this.width / 2;
            this.y = BASE_HEIGHT - 150;
            this.targetX = this.x;
            this.glow = 15;
        }

        update() {
            // Smooth movement lerp
            const lerpFactor = 0.2;
            this.x += (this.targetX - this.x) * lerpFactor;

            // Clamp to screen
            if (this.x < 0) this.x = 0;
            if (this.x > BASE_WIDTH - this.width) this.x = BASE_WIDTH - this.width;

            // Growth mechanic: increases height by 5px every 10 points
            const expectedHeight = PLAYER_START_HEIGHT + Math.floor(score / 10) * 5;
            if (this.height < expectedHeight) {
                this.height += 0.5; // Smooth growth
                this.y = BASE_HEIGHT - 150 - (this.height - PLAYER_START_HEIGHT);
            }
        }

        draw() {
            ctx.save();
            ctx.strokeStyle = '#00FFFF';
            ctx.lineWidth = PLAYER_STROKE;
            ctx.shadowBlur = this.glow;
            ctx.shadowColor = '#00FFFF';

            // Rounded capsule
            const r = this.width / 2;
            ctx.beginPath();
            ctx.moveTo(this.x + r, this.y);
            ctx.lineTo(this.x + this.width - r, this.y);
            ctx.arcTo(this.x + this.width, this.y, this.x + this.width, this.y + r, r);
            ctx.lineTo(this.x + this.width, this.y + this.height - r);
            ctx.arcTo(this.x + this.width, this.y + this.height, this.x + this.width - r, this.y + this.height, r);
            ctx.lineTo(this.x + r, this.y + this.height);
            ctx.arcTo(this.x, this.y + this.height, this.x, this.y + this.height - r, r);
            ctx.lineTo(this.x, this.y + r);
            ctx.arcTo(this.x, this.y, this.x + r, this.y, r);
            ctx.stroke();
            ctx.restore();
        }

        getBounds() {
            return {
                x: this.x,
                y: this.y,
                width: this.width,
                height: this.height
            };
        }
    }

    class Star {
        constructor() {
            const sizes = [20, 30, 40];
            this.size = sizes[Math.floor(Math.random() * sizes.length)];
            this.x = Math.random() * (BASE_WIDTH - this.size);
            this.y = -50;
            this.rotation = 0;
            this.rotSpeed = 1; // 1 degree per frame
        }

        update() {
            this.y += currentStarSpeed;
            this.rotation += this.rotSpeed;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
            ctx.rotate(this.rotation * Math.PI / 180);
            ctx.strokeStyle = '#00FFFF';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00FFFF';

            // Draw 5-pointed star outline
            ctx.beginPath();
            const cx = 0;
            const cy = 0;
            const spikes = 5;
            const outerRadius = this.size / 2;
            const innerRadius = outerRadius * 0.4;
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;

            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                rot += step;
                ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        getBounds() {
            return {
                x: this.x,
                y: this.y,
                width: this.size,
                height: this.size
            };
        }
    }

    class Particle {
        constructor(isExplosion = false, x, y) {
            this.isExplosion = isExplosion;
            if (isExplosion) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.02;
                this.size = Math.random() * 3 + 2;
            } else {
                this.x = Math.random() * BASE_WIDTH;
                this.y = Math.random() * BASE_HEIGHT;
                this.vx = 0;
                this.vy = -(Math.random() * 0.5 + 0.5); // Upward drift
                this.size = Math.random() * 2 + 2;
                this.opacity = Math.random() * 0.3 + 0.3;
            }
        }

        update() {
            if (this.isExplosion) {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            } else {
                this.y += this.vy;
                if (this.y < -10) {
                    this.y = BASE_HEIGHT + 10;
                    this.x = Math.random() * BASE_WIDTH;
                }
            }
        }

        draw() {
            ctx.fillStyle = '#00FFFF';
            ctx.save();
            if (this.isExplosion) {
                ctx.globalAlpha = this.life;
            } else {
                ctx.globalAlpha = this.opacity;
            }
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // Game variables
    let player;
    let stars = [];
    let backgroundParticles = [];
    let explosionParticles = [];

    function init() {
        // Create background particles
        backgroundParticles = [];
        for (let i = 0; i < 25; i++) {
            backgroundParticles.push(new Particle());
        }

        player = new Player();
        stars = [];
        explosionParticles = [];
        score = 0;
        currentStarSpeed = STAR_SPEED_INITIAL;
        currentSpawnInterval = STAR_SPAWN_INTERVAL_INITIAL;
        spawnTimer = 0;
        scoreTimer = 0;

        document.getElementById('start-high-score').innerText = highResult > 0 ? `HIGH SCORE: ${highResult}` : '';
        resize();
    }

    function startGame() {
        gameState = 'PLAYING';
        switchScreen('playing-screen');
        init();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        screenShake = 15;
        
        // Explosion at player position
        for (let i = 0; i < 15; i++) {
            explosionParticles.push(new Particle(true, player.x + player.width / 2, player.y + player.height / 2));
        }

        if (score > highResult) {
            highResult = score;
            localStorage.setItem('fastStarHighScore', highResult);
        }

        document.getElementById('final-score').innerText = `Score: ${score}`;
        document.getElementById('high-result').innerText = `HIGH RESULT: ${highResult}`;
        
        setTimeout(() => {
            switchScreen('game-over-screen');
            document.getElementById('home-btn').style.display = 'flex';
        }, 1000);

        playSound('collision');
    }

    function resetToTitle() {
        gameState = 'TITLE';
        switchScreen('title-screen');
        document.getElementById('home-btn').style.display = 'none';
        init();
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function update(deltaTime) {
        if (screenShake > 0) screenShake *= 0.9;

        backgroundParticles.forEach(p => p.update());

        if (gameState === 'PLAYING') {
            player.update();

            // Spawn stars
            spawnTimer += deltaTime;
            if (spawnTimer >= currentSpawnInterval) {
                stars.push(new Star());
                spawnTimer = 0;
            }

            // Update stars
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.update();

                // Collision detection
                if (rectIntersect(player.getBounds(), star.getBounds())) {
                    gameOver();
                }

                // Remove off-screen
                if (star.y > BASE_HEIGHT + 50) {
                    stars.splice(i, 1);
                }
            }

            // Score progression
            scoreTimer += deltaTime;
            if (scoreTimer >= 500) {
                score++;
                scoreTimer = 0;
                document.getElementById('current-score').innerText = `SCORE: ${score}`;

                // Difficulty increases
                if (score > 0 && score % 20 === 0) {
                    currentSpawnInterval = Math.max(MIN_SPAWN_INTERVAL, STAR_SPAWN_INTERVAL_INITIAL - (score / 20) * 50);
                }
                if (score > 0 && score % 50 === 0) {
                    currentStarSpeed += 0.5;
                }
                
                if (score % 2 === 0) playSound('score');
            }
        }

        // Always update explosions if any
        for (let i = explosionParticles.length - 1; i >= 0; i--) {
            const p = explosionParticles[i];
            p.update();
            if (p.life <= 0) explosionParticles.splice(i, 1);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        // Screen shake
        if (screenShake > 1) {
            const sx = (Math.random() - 0.5) * screenShake;
            const sy = (Math.random() - 0.5) * screenShake;
            ctx.translate(sx, sy);
        }

        // Draw center dashed line
        ctx.setLineDash([10, 15]);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(BASE_WIDTH / 2, 0);
        ctx.lineTo(BASE_WIDTH / 2, BASE_HEIGHT);
        ctx.stroke();
        ctx.setLineDash([]);

        backgroundParticles.forEach(p => p.draw());

        if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
            if (gameState === 'PLAYING') player.draw();
            stars.forEach(s => s.draw());
        }

        explosionParticles.forEach(p => p.draw());
        ctx.restore();
    }

    function gameLoop(time) {
        const deltaTime = time - lastTime;
        lastTime = time;

        update(deltaTime);
        draw();

        requestAnimationFrame(gameLoop);
    }

    function rectIntersect(r1, r2) {
        // Small padding for more forgiving collision
        const p = 4;
        return !(r2.x + p > r1.x + r1.width - p ||
                 r2.x + r2.width - p < r1.x + p ||
                 r2.y + p > r1.y + r1.height - p ||
                 r2.y + r2.height - p < r1.y + p);
    }

    function resize() {
        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;
        
        canvas.width = BASE_WIDTH;
        canvas.height = BASE_HEIGHT;
        
        // The scale is handled by CSS (width: 100%, height: 100%)
    }

    // Controls
    function handleInput(e) {
        let clientX;
        if (e.type.startsWith('touch')) {
            clientX = e.touches[0].clientX;
        } else {
            clientX = e.clientX;
        }

        const rect = container.getBoundingClientRect();
        const scaleX = BASE_WIDTH / rect.width;
        const x = (clientX - rect.left) * scaleX;
        
        if (player) {
            player.targetX = x - player.width / 2;
        }
    }

    window.addEventListener('mousemove', handleInput);
    window.addEventListener('touchstart', handleInput, {passive: false});
    window.addEventListener('touchmove', handleInput, {passive: false});

    container.addEventListener('mousedown', (e) => {
        if (gameState === 'TITLE') {
            startGame();
        }
    });

    document.getElementById('restart-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
    });

    document.getElementById('home-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        resetToTitle();
    });

    // Sound logic
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (isMuted) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;

        if (type === 'score') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'collision') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    document.getElementById('sound-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        isMuted = !isMuted;
        document.getElementById('sound-on-icon').style.display = isMuted ? 'none' : 'block';
        document.getElementById('sound-off-icon').style.display = isMuted ? 'block' : 'none';
        
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    });

    window.addEventListener('resize', resize);
    
    // Initialize
    init();
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
