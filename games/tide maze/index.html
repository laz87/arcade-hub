<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tide Maze</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-gold: #ffd700;
            --neon-pink: #ff0055;
            --dark-bg: #050a14;
            --card-bg: #111827;
            --sea-blue: #002642;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        
        body { 
            background: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
            color: white;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }

        #gameContainer { 
            position: relative; 
            width: 95vmin; 
            height: 95vmin; 
            max-width: 800px;
            max-height: 800px;
            border: 4px solid #1a1a1a; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8); 
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        canvas { 
            width: 100%; 
            height: 100%; 
            display: block;
            background: var(--sea-blue); 
        }

        /* --- HUD --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            padding: 15px;
            z-index: 10;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-panel {
            background: rgba(17, 24, 39, 0.8);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            display: flex;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 50px;
        }

        .stat-label { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Bungee', cursive; font-size: 1.1rem; color: var(--neon-blue); }
        .stat-value.gold { color: var(--neon-gold); }
        .stat-value.lives { color: var(--neon-pink); }

        /* --- Modals --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.2);
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-family: 'Bungee', cursive;
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .char-select {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
        }

        .char-option {
            cursor: pointer;
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 12px;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
        }

        .char-option.selected {
            border-color: var(--neon-gold);
            background: rgba(255, 215, 0, 0.1);
            transform: scale(1.1);
        }

        .char-icon { font-size: 2.5rem; display: block; margin-bottom: 5px; }
        .char-name { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: #94a3b8; }

        .btn {
            background: var(--neon-blue);
            color: black;
            border: none;
            padding: 15px 30px;
            font-family: 'Bungee', cursive;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .btn:hover {
            box-shadow: 0 0 20px var(--neon-blue);
            transform: scale(1.05);
        }

        #muteBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            pointer-events: auto;
            background: var(--card-bg);
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            font-size: 1.2rem;
        }

        .bounty-pop {
            position: absolute;
            font-family: 'Bungee', cursive;
            color: var(--neon-gold);
            pointer-events: none;
            animation: bounty-float 1s forwards;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--neon-gold);
        }

        @keyframes bounty-float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        #joystickContainer {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(0, 210, 255, 0.2);
            border-radius: 50%;
            display: none;
            z-index: 1000;
            pointer-events: auto;
        }

        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: var(--neon-blue);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        @media (pointer: coarse) {
            #joystickContainer { display: block; }
        }
    </style>
</head>
<body>
    <!-- HUD moved outside the grid -->
    <div id="hudOutside" class="stat-panel">
        <div class="stat-item">
            <span class="stat-label">Level</span>
            <span id="levelDisplay" class="stat-value">1</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Bounty</span>
            <span id="scoreDisplay" class="stat-value gold">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Lives</span>
            <span id="livesDisplay" class="stat-value lives">❤️❤️❤️</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Time</span>
            <span id="timer" class="stat-value">0:00</span>
        </div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div class="hud-top"></div>
            <button id="muteBtn">🔇</button>
        </div>
    </div>

    <div id="joystickContainer"><div id="joystickKnob"></div></div>

    <!-- Modals -->
    <div id="startModal" class="modal">
        <div class="modal-content">
            <h1>TIDE MAZE</h1>
            <p style="color: #94a3b8;">Grandline Navigator</p>
            <div class="char-select">
                <div class="char-option selected" onclick="selectChar('luffy', '🚢', event)">
                    <span class="char-icon">🚢</span>
                    <span class="char-name">Merry</span>
                </div>
                <div class="char-option" onclick="selectChar('zoro', '⚔️', event)">
                    <span class="char-icon">⚔️</span>
                    <span class="char-name">Zoro</span>
                </div>
                <div class="char-option" onclick="selectChar('nami', '🌤️', event)">
                    <span class="char-icon">🌤️</span>
                    <span class="char-name">Nami</span>
                </div>
            </div>
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 20px;">Collect the gold bounty before it moves!</p>
            <button class="btn" onclick="startGame()">START VOYAGE</button>
        </div>
    </div>

    <div id="gameOverModal" class="modal" style="display:none;">
        <div class="modal-content" style="border-color: var(--neon-pink);">
            <h1 style="background: linear-gradient(to right, var(--neon-pink), #ff5e00); -webkit-background-clip: text;">SHIPWRECKED</h1>
            <p id="finalBounty" style="font-family: 'Bungee'; color: var(--neon-gold); font-size: 1.5rem; margin: 20px 0;">Bounty: 0</p>
            <button class="btn" onclick="location.reload()">NEW VOYAGE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800; canvas.height = 800;

        // --- ENHANCED AUDIO ENGINE ---
        const AudioEngine = (() => {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let isMuted = true;
            let sailGain = null;
            let sailFilter = null;
            let initialized = false;

            const init = () => {
                if (initialized) return;
                initialized = true;

                // Setup Sail Sound (White Noise)
                const bufferSize = 2 * audioCtx.sampleRate;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                sailFilter = audioCtx.createBiquadFilter();
                sailFilter.type = 'lowpass';
                sailFilter.frequency.value = 400;

                sailGain = audioCtx.createGain();
                sailGain.gain.value = 0;

                whiteNoise.connect(sailFilter);
                sailFilter.connect(sailGain);
                sailGain.connect(audioCtx.destination);
                whiteNoise.start();

                playMusicLoop();
            };

            const playSound = (freq, type, duration, vol) => {
                if (isMuted || !initialized) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            };

            const playMusicLoop = () => {
                const shanty = [110, 0, 130, 146, 164, 0, 146, 130]; 
                let step = 0;
                setInterval(() => {
                    if (!isMuted && shanty[step % shanty.length] !== 0) {
                        playSound(shanty[step % shanty.length], 'triangle', 0.3, 0.05);
                    }
                    step++;
                }, 300);
            };

            return {
                init,
                toggle: () => { isMuted = !isMuted; if(audioCtx.state === 'suspended') audioCtx.resume(); return isMuted; },
                playCollect: () => playSound(880, 'sine', 0.2, 0.1),
                playMove: () => playSound(200, 'sine', 0.3, 0.05),
                playWin: () => { playSound(440, 'square', 0.15, 0.1); setTimeout(() => playSound(660, 'square', 0.3, 0.1), 100); },
                playHit: () => playSound(80, 'sawtooth', 0.3, 0.1),
                updateSail: (speed) => {
                    if (!sailGain || isMuted) return;
                    sailGain.gain.setTargetAtTime(Math.min(speed / 15, 0.12), audioCtx.currentTime, 0.1);
                    sailFilter.frequency.setTargetAtTime(400 + (speed * 80), audioCtx.currentTime, 0.1);
                },
                resume: () => audioCtx.resume()
            };
        })();

        // --- GAME STATE ---
        let level = 1, mazeSize = 8, cellSize = 100, maze = [];
        let score = 0, lives = 3, gameState = 'menu';
        let player = { x: 0, y: 0, vx: 0, vy: 0, radius: 20, accel: 0.45, fric: 0.92, emoji: '🚢' };
        let exit = { x: 0, y: 0 }, treasureTime = 0, levelStartTime = 0;
        let keys = {}, touchActive = false, joystickPos = { x: 0, y: 0 };

        function selectChar(id, emoji, event) {
            document.querySelectorAll('.char-option').forEach(opt => opt.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            player.emoji = emoji;
        }

        function startGame() {
            AudioEngine.init();
            document.getElementById('startModal').style.display = 'none';
            gameState = 'playing';
            levelStartTime = Date.now();
            initLevel();
        }

        function generateMaze(size) {
            const grid = Array.from({ length: size }, (_, y) => Array.from({ length: size }, (_, x) => ({ x, y, visited: false, walls: { top: true, right: true, bottom: true, left: true } })));
            const stack = []; const start = grid[0][0]; start.visited = true; stack.push(start);
            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                const neighbors = [];
                if (current.y > 0 && !grid[current.y - 1][current.x].visited) neighbors.push(grid[current.y - 1][current.x]);
                if (current.x < size - 1 && !grid[current.y][current.x + 1].visited) neighbors.push(grid[current.y][current.x + 1]);
                if (current.y < size - 1 && !grid[current.y + 1][current.x].visited) neighbors.push(grid[current.y + 1][current.x]);
                if (current.x > 0 && !grid[current.y][current.x - 1].visited) neighbors.push(grid[current.y][current.x - 1]);
                if (neighbors.length > 0) {
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    if (next.x > current.x) { current.walls.right = false; next.walls.left = false; }
                    else if (next.x < current.x) { current.walls.left = false; next.walls.right = false; }
                    else if (next.y > current.y) { current.walls.bottom = false; next.walls.top = false; }
                    else if (next.y < current.y) { current.walls.top = false; next.walls.bottom = false; }
                    next.visited = true; stack.push(next);
                } else stack.pop();
            }
            return grid;
        }

        function relocateTreasure(initial = false) {
            const locs = [{x: mazeSize - 1, y: mazeSize - 1}, {x: 0, y: mazeSize - 1}, {x: mazeSize - 1, y: 0}];
            let newLoc;
            do {
                newLoc = locs[Math.floor(Math.random() * locs.length)];
            } while (!initial && Math.floor(exit.x / cellSize) === newLoc.x && Math.floor(exit.y / cellSize) === newLoc.y);

            exit.x = (newLoc.x + 0.5) * cellSize; 
            exit.y = (newLoc.y + 0.5) * cellSize; 
            treasureTime = Date.now(); 
            if (!initial) AudioEngine.playMove();
        }

        function initLevel() {
            mazeSize = Math.min(15, 6 + level);
            cellSize = 800 / mazeSize;
            maze = generateMaze(mazeSize);
            player.x = cellSize / 2; player.y = cellSize / 2;
            player.vx = 0; player.vy = 0;
            relocateTreasure(true);
            updateUI();
        }

        function updateUI() {
            document.getElementById('levelDisplay').textContent = level;
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('livesDisplay').textContent = '❤️'.repeat(lives);
        }

        function spawnBountyPop(x, y, amount) {
            const el = document.createElement('div');
            el.className = 'bounty-pop';
            el.textContent = `+$${amount}`;
            el.style.left = `${(x / 800) * 100}%`;
            el.style.top = `${(y / 800) * 100}%`;
            document.getElementById('gameContainer').appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // --- INPUTS ---
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const joystickBase = document.getElementById('joystickContainer'), knob = document.getElementById('joystickKnob');
        const handleTouch = (e) => {
            if (gameState !== 'playing') return;
            e.preventDefault();
            AudioEngine.resume();
            if (e.touches.length > 0) {
                touchActive = true;
                const rect = joystickBase.getBoundingClientRect();
                const touch = e.touches[0];
                const dx = touch.clientX - (rect.left + rect.width / 2);
                const dy = touch.clientY - (rect.top + rect.height / 2);
                const dist = Math.min(rect.width / 2, Math.sqrt(dx * dx + dy * dy));
                const angle = Math.atan2(dy, dx);
                joystickPos = { x: Math.cos(angle) * (dist / (rect.width / 2)), y: Math.sin(angle) * (dist / (rect.width / 2)) };
                knob.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
            }
        };
        joystickBase.addEventListener('touchstart', handleTouch, {passive: false});
        joystickBase.addEventListener('touchmove', handleTouch, {passive: false});
        joystickBase.addEventListener('touchend', () => { touchActive = false; joystickPos = { x: 0, y: 0 }; knob.style.transform = `translate(-50%, -50%)`; }, {passive: false});

        document.getElementById('muteBtn').onclick = () => {
            const muted = AudioEngine.toggle();
            document.getElementById('muteBtn').textContent = muted ? "🔇" : "🔊";
        };

        function update() {
            if (gameState !== 'playing') { AudioEngine.updateSail(0); return; }

            // Movement
            if (keys['w'] || keys['arrowup']) player.vy -= player.accel;
            if (keys['s'] || keys['arrowdown']) player.vy += player.accel;
            if (keys['a'] || keys['arrowleft']) player.vx -= player.accel;
            if (keys['d'] || keys['arrowright']) player.vx += player.accel;

            if (touchActive) {
                player.vx += joystickPos.x * player.accel;
                player.vy += joystickPos.y * player.accel;
            }

            player.vx *= player.fric; player.vy *= player.fric;
            player.x += player.vx; player.y += player.vy;

            const speed = Math.hypot(player.vx, player.vy);
            AudioEngine.updateSail(speed);

            // Wall Collisions
            const cx = Math.floor(player.x / cellSize), cy = Math.floor(player.y / cellSize);
            if (cx >= 0 && cx < mazeSize && cy >= 0 && cy < mazeSize) {
                const cell = maze[cy][cx]; const r = player.radius; const x = cell.x * cellSize, y = cell.y * cellSize;
                let hit = false;
                if (cell.walls.top && player.y - r < y) { player.y = y + r; player.vy *= -0.5; hit = true; }
                if (cell.walls.bottom && player.y + r > y + cellSize) { player.y = y + cellSize - r; player.vy *= -0.5; hit = true; }
                if (cell.walls.left && player.x - r < x) { player.x = x + r; player.vx *= -0.5; hit = true; }
                if (cell.walls.right && player.x + r > x + cellSize) { player.x = x + cellSize - r; player.vx *= -0.5; hit = true; }
                
                // Extra check for corner cases or passing through walls
                if (hit) {
                    if (speed > 5) AudioEngine.playHit();
                }
            }

            // Treasure Collection
            if (Math.hypot(player.x - exit.x, player.y - exit.y) < 45) {
                const timeTaken = (Date.now() - treasureTime) / 1000;
                const bonus = Math.max(10, Math.floor(100 - timeTaken * 2));
                score += bonus;
                spawnBountyPop(exit.x, exit.y, bonus);
                AudioEngine.playCollect();
                
                level++;
                initLevel();
                AudioEngine.playWin();
            }

            // Bounty Move Timer
            if (Date.now() - treasureTime > 15000) relocateTreasure();
        }

        function render() {
            const time = Date.now() * 0.002;
            ctx.fillStyle = '#001a2d'; ctx.fillRect(0, 0, 800, 800);
            
            // Background waves
            ctx.strokeStyle = '#003d66'; ctx.lineWidth = 2;
            for (let i = 0; i < 800; i += 40) {
                ctx.beginPath();
                for (let j = 0; j < 800; j += 20) {
                    ctx.lineTo(i + Math.sin(time + j * 0.05) * 8, j);
                }
                ctx.stroke();
            }

            // Draw Maze
            ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 6; ctx.lineCap = 'round';
            ctx.shadowBlur = 10; ctx.shadowColor = '#3b82f6';
            maze.forEach(row => row.forEach(cell => {
                const x = cell.x * cellSize, y = cell.y * cellSize;
                const dist = Math.hypot(x + cellSize / 2 - player.x, y + cellSize / 2 - player.y);
                ctx.globalAlpha = Math.max(0.1, 1 - dist / 400);
                ctx.beginPath();
                if (cell.walls.top) { ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y); }
                if (cell.walls.bottom) { ctx.moveTo(x, y + cellSize); ctx.lineTo(x + cellSize, y + cellSize); }
                if (cell.walls.left) { ctx.moveTo(x, y); ctx.lineTo(x, y + cellSize); }
                if (cell.walls.right) { ctx.moveTo(x + cellSize, y); ctx.lineTo(x + cellSize, y + cellSize); }
                ctx.stroke();
            }));
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;

            // Draw Exit (Bounty)
            ctx.save();
            ctx.translate(exit.x, exit.y);
            const bounce = Math.sin(Date.now() * 0.01) * 5;
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 15; ctx.shadowColor = 'gold';
            ctx.fillText('💰', 0, bounce);
            ctx.restore();

            // Draw Player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.vx * 0.03);
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(player.emoji, 0, 0);
            ctx.restore();
        }

        function loop() {
            update();
            render();
            
            if (gameState === 'playing') {
                const s = Math.floor((Date.now() - levelStartTime) / 1000);
                document.getElementById('timer').textContent = `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
            }
            
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
