<header>
    <h1>Swahili Word Scramble</h1>
    <p class="subtitle">Unscramble the letters to find the Swahili word!</p>
</header>

<div id="game-container">
    <div id="stats">
        <div id="score">Score: 0</div>
        <div id="level">Level: 1</div>
    </div>

    <div class="card">
        <p id="hint">English Meaning: <span></span></p>
        <div id="scrambled-word"></div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Type your answer" autocomplete="off">
            <div id="message"></div>
            <div class="btn-container">
                <button class="btn-secondary" id="refresh-btn">Refresh Word</button>
                <button class="btn-primary" id="check-btn">Check Word</button>
            </div>
        </div>
    </div>
</div>

<div id="win-modal" class="modal">
    <div class="modal-content">
        <h2 style="font-family: 'Bangers', cursive; font-size: 3rem; color: var(--accent);">AWESOME!</h2>
        <p style="font-size: 1.2rem; margin-bottom: 20px;">You solved all words in this category!</p>
        <button class="btn-primary" id="next-level-btn" style="padding: 15px 40px; font-size: 1.5rem;">NEXT LEVEL</button>
    </div>
</div>

<script>
    const WORD_LIST = [
        { swahili: "RAFIKI", english: "Friend" },
        { swahili: "MAMA", english: "Mother" },
        { swahili: "BABA", english: "Father" },
        { swahili: "SHULE", english: "School" },
        { swahili: "CHAKULA", english: "Food" },
        { swahili: "MAJI", english: "Water" },
        { swahili: "KITABU", english: "Book" },
        { swahili: "SIMBA", english: "Lion" },
        { swahili: "TEMBO", english: "Elephant" },
        { swahili: "NYUMBA", english: "House" },
        { swahili: "KWAHERI", english: "Goodbye" },
        { swahili: "ASANTE", english: "Thank you" },
        { swahili: "KARIBU", english: "Welcome" },
        { swahili: "HABARI", english: "News/How are you" },
        { swahili: "JUMBA", english: "Building" },
        { swahili: "MEZA", english: "Table" },
        { swahili: "KITI", english: "Chair" },
        { swahili: "DIRISHA", english: "Window" },
        { swahili: "MLANGO", english: "Door" },
        { swahili: "SAFARI", english: "Journey" }
    ];

    let currentWordIndex = 0;
    let score = 0;
    let level = 1;
    let currentWord = "";
    let shuffledWord = "";

    const scrambledWordEl = document.getElementById('scrambled-word');
    const hintEl = document.querySelector('#hint span');
    const userInput = document.getElementById('user-input');
    const checkBtn = document.getElementById('check-btn');
    const refreshBtn = document.getElementById('refresh-btn');
    const messageEl = document.getElementById('message');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const winModal = document.getElementById('win-modal');
    const nextLevelBtn = document.getElementById('next-level-btn');

    function shuffle(word) {
        let array = word.split('');
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        let result = array.join('');
        if (result === word) return shuffle(word); // Ensure it's actually shuffled
        return result;
    }

    function loadWord() {
        if (currentWordIndex >= WORD_LIST.length) {
            showWinModal();
            return;
        }

        const wordObj = WORD_LIST[currentWordIndex];
        currentWord = wordObj.swahili.toUpperCase();
        shuffledWord = shuffle(currentWord);
        scrambledWordEl.textContent = shuffledWord;
        hintEl.textContent = wordObj.english;
        userInput.value = "";
        messageEl.textContent = "";
        messageEl.className = "";
        userInput.focus();
    }

    function checkWord() {
        const userValue = userInput.value.trim().toUpperCase();
        if (userValue === "") {
            messageEl.textContent = "Please enter a word!";
            messageEl.className = "error-text";
            return;
        }

        if (userValue === currentWord) {
            score += 10;
            scoreEl.textContent = `Score: ${score}`;
            messageEl.textContent = "Correct! Well done!";
            messageEl.className = "success-text";
            
            setTimeout(() => {
                currentWordIndex++;
                if (currentWordIndex % 5 === 0 && currentWordIndex !== 0) {
                    level++;
                    levelEl.textContent = `Level: ${level}`;
                }
                loadWord();
            }, 1500);
        } else {
            messageEl.textContent = "Oops! Try again.";
            messageEl.className = "error-text";
            userInput.value = "";
            userInput.focus();
        }
    }

    function showWinModal() {
        winModal.style.display = 'flex';
    }

    checkBtn.addEventListener('click', checkWord);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkWord();
    });

    refreshBtn.addEventListener('click', () => {
        shuffledWord = shuffle(currentWord);
        scrambledWordEl.textContent = shuffledWord;
        userInput.value = "";
        messageEl.textContent = "Word refreshed!";
        messageEl.className = "";
    });

    nextLevelBtn.addEventListener('click', () => {
        winModal.style.display = 'none';
        currentWordIndex = 0;
        level = 1;
        score = 0;
        scoreEl.textContent = `Score: ${score}`;
        levelEl.textContent = `Level: ${level}`;
        // Shuffle the word list for replay
        WORD_LIST.sort(() => Math.random() - 0.5);
        loadWord();
    });

    // Initial Load
    loadWord();
</script>
