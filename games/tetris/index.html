<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Tetris</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #111;
            --text-color: #fff;
            --accent-color: #00f2ff;
            --grid-line: #222;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            display: flex;
            gap: 20px;
            padding: 25px;
            background-color: var(--panel-color);
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
            position: relative;
            border: 1px solid #333;
        }

        canvas {
            border: 2px solid #333;
            background-color: #000;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #stats-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 140px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        #next-canvas, #hold-canvas {
            margin-top: 8px;
            border: 1px solid #222;
            background: #000;
        }

        #controls-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #555;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
        }

        .btn-container {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
            width: 90%;
            max-width: 400px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.5rem;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }

        .control-btn:active {
            background: rgba(0, 242, 255, 0.2);
        }

        #btn-rotate { grid-column: span 1; }
        #btn-hold { grid-column: span 1; }
        #btn-drop { grid-column: span 2; background: rgba(0, 242, 255, 0.1); border-color: var(--accent-color); }

        @media (max-height: 750px) {
            #game-container { transform: scale(0.9); }
        }

        @media (max-width: 600px) {
            #game-container {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }
            #stats-container {
                flex-direction: row;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 10px;
            }
            .stat-box {
                flex: 1;
                min-width: 70px;
                padding: 8px;
            }
            .stat-value { font-size: 1.1rem; }
            .btn-container { display: grid; }
            #controls-hint { display: none; }
            #next-canvas, #hold-canvas { width: 60px; height: 60px; }
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        #overlay h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
            letter-spacing: 0.2em;
        }

        .high-score-display {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 30px;
        }

        #start-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 18px 50px;
            font-size: 1.4rem;
            font-weight: 800;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.5);
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        .shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>TETRIS</h1>
        <div class="high-score-display">HIGH SCORE: <span id="high-score-val">0</span></div>
        <button id="start-btn">START GAME</button>
    </div>

    <div id="game-container">
        <canvas id="tetris" width="300" height="600"></canvas>
        <div id="stats-container">
            <div class="stat-box">
                <div class="stat-label">Next</div>
                <canvas id="next-canvas" width="80" height="80"></canvas>
            </div>
            <div class="stat-box">
                <div class="stat-label">Hold</div>
                <canvas id="hold-canvas" width="80" height="80"></canvas>
            </div>
            <div class="stat-box">
                <div class="stat-label">Score</div>
                <div id="score" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Level</div>
                <div id="level" class="stat-value">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Lines</div>
                <div id="lines" class="stat-value">0</div>
            </div>
        </div>
    </div>

    <div id="controls-hint">
        <b>← →</b> Move &nbsp; <b>↑</b> Rotate &nbsp; <b>↓</b> Soft Drop<br>
        <b>SPACE</b> Hard Drop &nbsp; <b>C</b> Hold &nbsp; <b>P</b> Pause
    </div>

    <div class="btn-container">
        <button class="control-btn" id="btn-left">←</button>
        <button class="control-btn" id="btn-right">→</button>
        <button class="control-btn" id="btn-rotate">↻</button>
        <button class="control-btn" id="btn-hold">H</button>
        <button class="control-btn" id="btn-down">↓</button>
        <button class="control-btn" id="btn-drop">DROP</button>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('hold-canvas');
        const holdContext = holdCanvas.getContext('2d');

        const gridWidth = 10;
        const gridHeight = 20;
        const cellSize = 30;

        context.scale(cellSize, cellSize);
        nextContext.scale(20, 20); // Smaller scale for previews
        holdContext.scale(20, 20);

        const COLORS = [
            null,
            '#FF0D72', // T - Pink
            '#0DC2FF', // I - Blue
            '#0DFF72', // S - Green
            '#F538FF', // Z - Purple
            '#FF8E0D', // L - Orange
            '#FFE138', // O - Yellow
            '#3877FF', // J - Dark Blue
        ];

        // Audio Context for SFX
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const SFX = {
            move: () => playSound(200, 'square', 0.05, 0.05),
            rotate: () => playSound(400, 'triangle', 0.1, 0.05),
            drop: () => playSound(100, 'sine', 0.1, 0.1),
            clear: () => {
                playSound(600, 'sine', 0.2, 0.1);
                setTimeout(() => playSound(800, 'sine', 0.2, 0.1), 50);
            },
            levelUp: () => {
                playSound(400, 'sine', 0.1, 0.1);
                setTimeout(() => playSound(600, 'sine', 0.1, 0.1), 100);
                setTimeout(() => playSound(800, 'sine', 0.3, 0.1), 200);
            },
            gameOver: () => playSound(150, 'sawtooth', 0.5, 0.1)
        };

        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 5, 0],
                    [0, 5, 0],
                    [0, 5, 5],
                ];
            } else if (type === 'J') {
                return [
                    [0, 7, 0],
                    [0, 7, 0],
                    [7, 7, 0],
                ];
            } else if (type === 'O') {
                return [
                    [6, 6],
                    [6, 6],
                ];
            } else if (type === 'Z') {
                return [
                    [4, 4, 0],
                    [0, 4, 4],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 3, 3],
                    [3, 3, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 1, 0],
                    [1, 1, 1],
                    [0, 0, 0],
                ];
            }
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function drawMatrix(matrix, offset, ctx = context, isGhost = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        if (isGhost) {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                            ctx.lineWidth = 0.05;
                            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        } else {
                            // Block fill
                            ctx.fillStyle = COLORS[value];
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                            
                            // Top highlight
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                            ctx.fillRect(x + offset.x, y + offset.y, 1, 0.1);
                            
                            // Left highlight
                            ctx.fillRect(x + offset.x, y + offset.y, 0.1, 1);

                            // Bottom/Right shadow
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                            ctx.fillRect(x + offset.x, y + offset.y + 0.9, 1, 0.1);
                            ctx.fillRect(x + offset.x + 0.9, y + offset.y, 0.1, 1);
                        }
                    }
                });
            });
        }

        let particles = [];
        function createParticles(y) {
            for (let x = 0; x < gridWidth; x++) {
                for (let i = 0; i < 4; i++) {
                    particles.push({
                        x: x + Math.random(),
                        y: y + Math.random(),
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: (Math.random() - 0.5) * 0.2,
                        life: 1.0,
                        color: COLORS[arena[y][x]] || '#fff'
                    });
                }
            }
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) {
                    particles.splice(index, 1);
                } else {
                    context.fillStyle = p.color;
                    context.globalAlpha = p.life;
                    context.fillRect(p.x, p.y, 0.1, 0.1);
                    context.globalAlpha = 1;
                }
            });
        }

        function draw() {
            // Background
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Grid lines
            context.strokeStyle = '#111';
            context.lineWidth = 0.02;
            for (let i = 0; i <= gridWidth; i++) {
                context.beginPath();
                context.moveTo(i, 0);
                context.lineTo(i, gridHeight);
                context.stroke();
            }
            for (let i = 0; i <= gridHeight; i++) {
                context.beginPath();
                context.moveTo(0, i);
                context.lineTo(gridWidth, i);
                context.stroke();
            }

            drawMatrix(arena, {x: 0, y: 0});
            
            // Draw Ghost
            const ghostPos = {x: player.pos.x, y: player.pos.y};
            while (!collide(arena, {matrix: player.matrix, pos: ghostPos})) {
                ghostPos.y++;
            }
            ghostPos.y--;
            drawMatrix(player.matrix, ghostPos, context, true);

            drawMatrix(player.matrix, player.pos);
            drawParticles();
            
            // Draw Next Piece
            nextContext.fillStyle = '#000';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            drawMatrix(nextPiece, {x: 1, y: 1}, nextContext);

            // Draw Hold Piece
            holdContext.fillStyle = '#000';
            holdContext.fillRect(0, 0, holdCanvas.width, holdCanvas.height);
            if (holdPiece) {
                drawMatrix(holdPiece, {x: 1, y: 1}, holdContext);
            }
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 0;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                createParticles(y);
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                rowCount++;
            }

            if (rowCount > 0) {
                SFX.clear();
                const scoreTable = [0, 100, 300, 500, 800];
                player.score += scoreTable[rowCount] * player.level;
                player.lines += rowCount;
                
                if (player.lines >= player.level * 10) {
                    player.level += 1;
                    dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
                    SFX.levelUp();
                }
                
                shakeScreen();
                updateScore();
            }
        }

        function shakeScreen() {
            const container = document.getElementById('game-container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 200);
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
                SFX.drop();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            } else {
                SFX.move();
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = nextPiece;
            nextPiece = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) -
                           (player.matrix[0].length / 2 | 0);
            canHold = true;
            if (collide(arena, player)) {
                gameOver();
            }
        }

        function playerHold() {
            if (!canHold) return;
            
            if (!holdPiece) {
                holdPiece = player.matrix;
                playerReset();
            } else {
                const temp = player.matrix;
                player.matrix = holdPiece;
                holdPiece = temp;
                player.pos.y = 0;
                player.pos.x = (arena[0].length / 2 | 0) -
                               (player.matrix[0].length / 2 | 0);
            }
            canHold = false;
            SFX.rotate();
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
            SFX.rotate();
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function update(time = 0) {
            if (isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
            document.getElementById('lines').innerText = player.lines;
            
            if (player.score > highScore) {
                highScore = player.score;
                localStorage.setItem('tetrisHighScore', highScore);
                document.getElementById('high-score-val').innerText = highScore;
            }
        }

        function gameOver() {
            SFX.gameOver();
            isPaused = true;
            document.getElementById('overlay').style.display = 'flex';
            document.querySelector('#overlay h1').innerText = 'GAME OVER';
            document.getElementById('start-btn').innerText = 'RETRY';
        }

        function togglePause() {
            if (document.getElementById('overlay').style.display === 'flex' && !isPaused) return;
            
            isPaused = !isPaused;
            if (isPaused) {
                document.getElementById('overlay').style.display = 'flex';
                document.querySelector('#overlay h1').innerText = 'PAUSED';
                document.getElementById('start-btn').innerText = 'RESUME';
            } else {
                document.getElementById('overlay').style.display = 'none';
                lastTime = performance.now();
                update();
            }
        }

        const arena = createMatrix(10, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            level: 1,
            lines: 0,
        };

        let nextPiece = createPiece('I');
        let holdPiece = null;
        let canHold = true;
        let isPaused = true;
        let highScore = localStorage.getItem('tetrisHighScore') || 0;
        document.getElementById('high-score-val').innerText = highScore;

        document.getElementById('start-btn').addEventListener('click', () => {
            if (audioCtx === null) {
                audioCtx = new AudioCtx();
            }
            
            if (document.querySelector('#overlay h1').innerText === 'PAUSED') {
                togglePause();
                return;
            }

            document.getElementById('overlay').style.display = 'none';
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
            player.lines = 0;
            holdPiece = null;
            canHold = true;
            dropInterval = 1000;
            updateScore();
            playerReset();
            isPaused = false;
            lastTime = performance.now();
            update();
        });

        document.addEventListener('keydown', event => {
            if (event.keyCode === 80) { // P - Pause
                togglePause();
                return;
            }

            if (isPaused) return;
            
            if (event.keyCode === 37) {
                playerMove(-1);
            } else if (event.keyCode === 39) {
                playerMove(1);
            } else if (event.keyCode === 40) {
                playerDrop();
            } else if (event.keyCode === 38) {
                playerRotate(1);
            } else if (event.keyCode === 67) { // C - Hold
                playerHold();
            } else if (event.keyCode === 32) { // Space - Hard Drop
                let dropDist = 0;
                while (!collide(arena, player)) {
                    player.pos.y++;
                    dropDist++;
                }
                player.pos.y--;
                player.score += dropDist * 2;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
                SFX.drop();
                shakeScreen();
            }
        });

        // Mobile Controls
        const handleTouch = (id, fn) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                if (audioCtx === null) audioCtx = new AudioCtx();
                if (!isPaused) fn(); 
            });
            btn.addEventListener('click', (e) => {
                if (audioCtx === null) audioCtx = new AudioCtx();
                if (!isPaused) fn();
            });
        };

        handleTouch('btn-left', () => playerMove(-1));
        handleTouch('btn-right', () => playerMove(1));
        handleTouch('btn-rotate', () => playerRotate(1));
        handleTouch('btn-hold', () => playerHold());
        handleTouch('btn-down', () => playerDrop());
        handleTouch('btn-drop', () => {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            SFX.drop();
            shakeScreen();
        });

        // Initial draw
        playerReset();
        draw();
        updateScore();
    </script>
</body>
</html>
