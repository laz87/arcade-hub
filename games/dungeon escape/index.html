<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dungeon Escape - Wall Jumper</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --wall-color: #16213e;
            --player-color: #f7d794;
            --spike-color: #e94560;
            --lava-color: #ff4d00;
            --text-color: #ffffff;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: #0f0f1b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: var(--bg-color);
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }
        .hud {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .menu-overlay {
            background: rgba(0, 0, 0, 0.7);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        .hidden {
            display: none !important;
            opacity: 0;
        }
        h1 { font-size: 32px; margin-bottom: 10px; color: var(--player-color); text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 18px; margin-bottom: 20px; }
        .btn {
            padding: 12px 30px;
            font-size: 20px;
            background: var(--spike-color);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            text-transform: uppercase;
            font-weight: bold;
        }
        .btn:active { transform: scale(0.95); }
        #best-score { font-size: 14px; margin-top: 10px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div class="hud" id="hud">Score: 0</div>
            
            <div id="start-menu" class="menu-overlay">
                <h1>Dungeon Escape</h1>
                <p>Hold to Charge. Release to Jump!</p>
                <button class="btn" onclick="startGame()">Start Game</button>
                <div id="best-score">Best: 0</div>
            </div>

            <div id="game-over-menu" class="menu-overlay hidden">
                <h1>Game Over</h1>
                <p id="final-score">Score: 0</p>
                <button class="btn" onclick="startGame()">Try Again</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const startMenu = document.getElementById('start-menu');
    const gameOverMenu = document.getElementById('game-over-menu');
    const finalScoreText = document.getElementById('final-score');
    const bestScoreText = document.getElementById('best-score');

    // 1. Create the image object
const playerSprite = new Image();

// 2. Set the source (The URL of the image)
playerSprite.src = 'https://opengameart.org/sites/default/files/icon_10.png'; 

// 3. (Optional) Let's add a "ready" check to make sure it loads
let spriteLoaded = false;
playerSprite.onload = () => {
    spriteLoaded = true;
};

// Load Dungeon Wall Texture
const wallTexture = new Image();
wallTexture.src = 'https://opengameart.org/sites/default/files/handpaintedwall2.png'; // A seamless stone brick texture

    // Constants
    const CANVAS_WIDTH = 360;
    const CANVAS_HEIGHT = 600;
    const WALL_WIDTH = 25;
    const PLAYER_RADIUS = 12;
    const GRAVITY = 0.28;
    const JUMP_FORCE = -5.5;
    const HORIZONTAL_SPEED = 3.5;
    const SPIKE_SIZE = 18;
    
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // Game State
    let score = 0;
    let bestScore = localStorage.getItem('dungeon_escape_best') || 0;
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let particles = [];
    let spikes = [];
    let lastWallHit = ''; // 'LEFT' or 'RIGHT'
    let shakeAmount = 0;
    let scrollY = 0;
    let scrollSpeed = 0.5;
    let lavaY = CANVAS_HEIGHT; // Visual representation of the bottom death zone
    let nextChunkY = -600; // next chunk start Y to generate (decreasing upwards)

    let player = {
        x: CANVAS_WIDTH / 2,
        y: CANVAS_HEIGHT / 2,
        vx: 0,
        vy: 0,
        color: '#f7d794',
        eyeOffset: 0,
        rotation: 0,
        side: 'LEFT', // 'LEFT' or 'RIGHT'
        isJumping: false,
        charge: 0,
        isCharging: false
    };

    const MAX_CHARGE = 100;
    const JUMP_POWER_X = 8;
    const JUMP_POWER_Y = -10;

    bestScoreText.innerText = `Best: ${bestScore}`;

    function startGame() {
        score = 0;
        gameState = 'PLAYING';
        startMenu.classList.add('hidden');
        gameOverMenu.classList.add('hidden');
        hud.innerText = `Score: ${score}`;
        hud.classList.remove('hidden');
        
        player.side = 'LEFT';
        player.x = WALL_WIDTH + PLAYER_RADIUS;
        player.y = CANVAS_HEIGHT - 250; // Start higher up to give space for lava
        player.vx = 0;
        player.vy = 0;
        player.rotation = 0;
        player.isJumping = false;
        player.isCharging = false;
        player.charge = 0;
        
        spikes = [];
        particles = [];
        lastWallHit = 'LEFT';
        scrollY = 0;
        scrollSpeed = 0.8;
        lavaY = CANVAS_HEIGHT - 50; // Start slightly visible
        
        // Initial spikes (generate 3 chunks above the starting area)
        for(let i = 0; i < 3; i++) {
            generateSpikesChunk(CANVAS_HEIGHT - 600 - (i * 600));
        }
        nextChunkY = CANVAS_HEIGHT - 600 - (3 * 600); // prepare the next chunk above
    }

    function generateSpikesChunk(startY) {
        // Generate spikes in a vertical range (chunk)
        const count = Math.min(3 + Math.floor(score / 15), 6);
        const sides = ['LEFT', 'RIGHT'];
        
        for(let i = 0; i < count; i++) {
            const side = sides[Math.floor(Math.random() * 2)];
            spikes.push({
                x: side === 'LEFT' ? WALL_WIDTH : CANVAS_WIDTH - WALL_WIDTH,
                y: startY + Math.random() * 600,
                side: side
            });
        }
    }

    function startCharging() {
        if (gameState !== 'PLAYING' || player.isJumping) return;
        player.isCharging = true;
        player.charge = 0;
    }

    function releaseJump() {
        if (gameState !== 'PLAYING' || !player.isCharging) return;
        
        const jumpFactor = 0.5 + (player.charge / MAX_CHARGE) * 0.5;
        player.vx = (player.side === 'LEFT' ? JUMP_POWER_X : -JUMP_POWER_X) * jumpFactor;
        player.vy = JUMP_POWER_Y * jumpFactor;
        player.isJumping = true;
        player.isCharging = false;
        player.charge = 0;

        // Small puff of air
        for(let i = 0; i < 5; i++) {
            particles.push({
                x: player.x,
                y: player.y + PLAYER_RADIUS,
                vx: (Math.random() - 0.5) * 4,
                vy: 2 + Math.random() * 2,
                radius: Math.random() * 4 + 1,
                life: 0.8,
                color: 'rgba(255, 255, 255, 0.4)'
            });
        }
    }

    function createExplosion(x, y, color) {
        for(let i = 0; i < 15; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                radius: Math.random() * 4 + 2,
                life: 1.0,
                color: color
            });
        }
    }

    function onJump() {
        // Not used anymore in the new mechanic
    }

    function update() {
        if (gameState !== 'PLAYING') {
            // Only update particles in menu to keep bubbles/effects alive
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(index, 1);
            });
            return;
        }

        if (player.isCharging) {
            player.charge = Math.min(player.charge + 2, MAX_CHARGE);
        }

        // Apply Physics
        if (player.isJumping) {
            player.vy += GRAVITY;
            player.y += player.vy;
            player.x += player.vx;
            
            // Rotation based on movement
            player.rotation = player.vx * 0.05 + player.vy * 0.02;
        } else {
            // Stuck to wall
            player.rotation = 0;
            player.vx = 0;
            player.vy = 0;
            if (player.side === 'LEFT') {
                player.x = WALL_WIDTH + PLAYER_RADIUS;
            } else {
                player.x = CANVAS_WIDTH - WALL_WIDTH - PLAYER_RADIUS;
            }
        }

            // Forced Scrolling behavior
        scrollY -= scrollSpeed;
        // This moves the "kill line" 60 pixels up from the bottom
        lavaY = scrollY + CANVAS_HEIGHT - 60; 

        // Check if player's bottom edge touches the lava
        if (player.y + PLAYER_RADIUS > lavaY) {
            endGame();
        }
        // Speed up scroll over time
        scrollSpeed = 0.8 + (score * 0.05);

        // Generate new spikes as we move up (prepare chunks ahead of camera)
        if (scrollY < nextChunkY + 600) {
            generateSpikesChunk(nextChunkY);
            nextChunkY -= 600;
        }
        
        // Cleanup off-screen spikes (remove those far below the lava)
        spikes = spikes.filter(s => s.y < lavaY + 100);

        // Wall Bounce
        if (player.isJumping) {
            if (player.x + PLAYER_RADIUS > CANVAS_WIDTH - WALL_WIDTH && player.side === 'LEFT') {
                player.x = CANVAS_WIDTH - WALL_WIDTH - PLAYER_RADIUS;
                player.isJumping = false;
                player.side = 'RIGHT';
                onWallHit('RIGHT');
            } else if (player.x - PLAYER_RADIUS < WALL_WIDTH && player.side === 'RIGHT') {
                player.x = WALL_WIDTH + PLAYER_RADIUS;
                player.isJumping = false;
                player.side = 'LEFT';
                onWallHit('LEFT');
            }
        }

        // Lose Conditions handled by lava (bottom). No death at top; endless upward.

        // Spike Collision
        spikes.forEach(spike => {
            const dx = player.x - spike.x;
            const dy = player.y - spike.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < PLAYER_RADIUS + SPIKE_SIZE * 0.4) {
                endGame();
            }
        });

        // Update Particles
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(index, 1);
        });

        if (shakeAmount > 0) shakeAmount *= 0.9;
    }

    function onWallHit(side) {
        if (lastWallHit !== side) {
            score++;
            hud.innerText = `Score: ${score}`;
            lastWallHit = side;
            
            // Wall impact effects
            shakeAmount = 4;
            createExplosion(
                side === 'LEFT' ? WALL_WIDTH : CANVAS_WIDTH - WALL_WIDTH,
                player.y,
                'rgba(255, 255, 255, 0.5)'
            );
        }
    }

    function endGame() {
        if (gameState === 'GAMEOVER') return;
        gameState = 'GAMEOVER';
        shakeAmount = 15;
        createExplosion(player.x, player.y, player.color);
        
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('dungeon_escape_best', bestScore);
            bestScoreText.innerText = `Best: ${bestScore}`;
        }

        setTimeout(() => {
            gameOverMenu.classList.remove('hidden');
            finalScoreText.innerText = `Score: ${score}`;
        }, 500);
    }

    function draw() {
        ctx.save();
        if (shakeAmount > 0.5) {
            ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
        }

        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        
       // Create the repeating stone pattern
    const pattern = ctx.createPattern(wallTexture, 'repeat');
    
    ctx.save();
    ctx.translate(0, -scrollY);

    // 1. Draw the Background (The deep wall)
    ctx.fillStyle = pattern;
    ctx.fillRect(0, scrollY, CANVAS_WIDTH, CANVAS_HEIGHT);
    
    // 2. Add a dark "vignette" overlay to make it look spooky and deep
    const darkness = ctx.createLinearGradient(0, scrollY, 0, scrollY + CANVAS_HEIGHT);
    darkness.addColorStop(0, 'rgba(0,0,0,0.4)');
    darkness.addColorStop(0.5, 'rgba(0,0,0,0)');
    darkness.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = darkness;
    ctx.fillRect(0, scrollY, CANVAS_WIDTH, CANVAS_HEIGHT);

    // ... (rest of your wall and spike code) ...

        // Background Grid (scrolling)
        ctx.strokeStyle = "rgba(255,255,255,0.03)";
        ctx.lineWidth = 1;
        for(let i = 0; i < CANVAS_WIDTH; i += 40) {
            ctx.beginPath(); ctx.moveTo(i, scrollY); ctx.lineTo(i, scrollY + CANVAS_HEIGHT); ctx.stroke();
        }
        let gridStart = Math.floor(scrollY / 40) * 40;
        for(let i = gridStart; i < scrollY + CANVAS_HEIGHT + 40; i += 40) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CANVAS_WIDTH, i); ctx.stroke();
        }

        // Draw Walls
        ctx.fillStyle = "#16213e";
        ctx.fillRect(0, scrollY, WALL_WIDTH, CANVAS_HEIGHT);
        ctx.fillRect(CANVAS_WIDTH - WALL_WIDTH, scrollY, WALL_WIDTH, CANVAS_HEIGHT);
        
        // Wall highlights
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.fillRect(WALL_WIDTH - 5, scrollY, 5, CANVAS_HEIGHT);
        ctx.fillRect(CANVAS_WIDTH - WALL_WIDTH, scrollY, 5, CANVAS_HEIGHT);



            // 1. Draw the Main Lava Body (The 60px solid block)
        ctx.fillStyle = "#e94560"; 
        ctx.fillRect(0, lavaY, CANVAS_WIDTH, 200); // Draws 200px deep to ensure no gaps

        // 2. Add a bright "Surface" line
        ctx.fillStyle = "#ff4d00";
        ctx.fillRect(0, lavaY, CANVAS_WIDTH, 6); // 6px thick hot edge

        // 3. Add a Glow/Gradient above the lava
        let glow = ctx.createLinearGradient(0, lavaY - 50, 0, lavaY);
        glow.addColorStop(0, "rgba(233, 69, 96, 0)");   // Transparent
        glow.addColorStop(1, "rgba(233, 69, 96, 0.4)"); // Faint Red
        ctx.fillStyle = glow;
        ctx.fillRect(0, lavaY - 50, CANVAS_WIDTH, 50);
        


        // Lava bubbles
        if (gameState === 'PLAYING') {
            if (Math.random() < 0.1) {
                particles.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: lavaY,
                    vx: (Math.random() - 0.5) * 1,
                    vy: -Math.random() * 2,
                    radius: Math.random() * 5 + 2,
                    life: 0.6,
                    color: '#ff4d00'
                });
            }
        }

        // Draw Spikes
        ctx.fillStyle = "#e94560";
        spikes.forEach(spike => {
            ctx.beginPath();
            if (spike.side === 'LEFT') {
                ctx.moveTo(spike.x, spike.y - SPIKE_SIZE);
                ctx.lineTo(spike.x + SPIKE_SIZE, spike.y);
                ctx.lineTo(spike.x, spike.y + SPIKE_SIZE);
            } else {
                ctx.moveTo(spike.x, spike.y - SPIKE_SIZE);
                ctx.lineTo(spike.x - SPIKE_SIZE, spike.y);
                ctx.lineTo(spike.x, spike.y + SPIKE_SIZE);
            }
            ctx.fill();
            
            // Spike highlight
            ctx.fillStyle = "rgba(255,255,255,0.1)";
            ctx.beginPath();
            if (spike.side === 'LEFT') {
                ctx.moveTo(spike.x, spike.y - SPIKE_SIZE);
                ctx.lineTo(spike.x + SPIKE_SIZE * 0.5, spike.y);
                ctx.lineTo(spike.x, spike.y);
            } else {
                ctx.moveTo(spike.x, spike.y - SPIKE_SIZE);
                ctx.lineTo(spike.x - SPIKE_SIZE * 0.5, spike.y);
                ctx.lineTo(spike.x, spike.y);
            }
            ctx.fill();
            ctx.fillStyle = "#e94560";
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Draw Player
        if (gameState === 'PLAYING') {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);
            
            // Squash and stretch based on velocity or charge
            let stretch = 0;
            if (player.isJumping) {
                stretch = Math.min(Math.abs(player.vy) * 0.05, 0.3);
            } else if (player.isCharging) {
                stretch = -(player.charge / MAX_CHARGE) * 0.4;
            }
            
            const scaleX = 1 - stretch;
            const scaleY = 1 + stretch;
            ctx.scale(scaleX, scaleY);

            if (spriteLoaded) {
        // This draws the image centered on the player's position
        // We use PLAYER_RADIUS * 2.5 to make the sprite slightly bigger than the hitbox
        const size = PLAYER_RADIUS * 2.8;
        
        ctx.save();
        // Flip the sprite if moving left
        if (player.side === 'LEFT') {
            ctx.scale(-1, 1);
        }
        
        ctx.drawImage(playerSprite, -size/2, -size/2, size, size);
        ctx.restore();
    } else {
        // Fallback: if image hasn't loaded yet, draw the original circle
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
        ctx.fill();
    }

            // Charge indicator
            if (player.isCharging) {
                ctx.restore();
                ctx.save();
                ctx.translate(player.x, player.y - PLAYER_RADIUS - 10);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(-15, 0, 30, 4);
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(-15, 0, (player.charge / MAX_CHARGE) * 30, 4);
            }

            ctx.restore();
        }

        ctx.restore(); // Restore world translation
        ctx.restore(); // Restore shake translation
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Input handling
    window.addEventListener('mousedown', (e) => {
        if (e.target.tagName !== 'BUTTON' && e.target.closest('.menu-overlay') === null) {
            if (gameState === 'PLAYING') {
                startCharging();
            } else if (gameState === 'START' || gameState === 'GAMEOVER') {
                startGame();
            }
        }
    });

    window.addEventListener('mouseup', (e) => {
        if (gameState === 'PLAYING') {
            releaseJump();
        }
    });

    window.addEventListener('touchstart', (e) => {
        if (e.target.tagName !== 'BUTTON' && e.target.closest('.menu-overlay') === null) {
            e.preventDefault();
            if (gameState === 'PLAYING') {
                startCharging();
            } else if (gameState === 'START' || gameState === 'GAMEOVER') {
                startGame();
            }
        }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
        if (gameState === 'PLAYING') {
            releaseJump();
        }
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            if (gameState === 'PLAYING') {
                startCharging();
            } else if (gameState === 'START' || gameState === 'GAMEOVER') {
                startGame();
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            if (gameState === 'PLAYING') {
                releaseJump();
            }
        }
    });

    loop();
</script>
</body>
</html>
