<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Emoji Ops - Neon Assault</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff0055;
            --neon-green: #39ff14;
            --gold: #ffd700;
            --dark-bg: #050505;
            --card-bg: #111;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

        body {
            background: var(--dark-bg);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0,210,255,0.06) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(255,0,85,0.06) 0%, transparent 45%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 95vw;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            overflow: hidden;
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #081410;
        }

        /* HUD */
        #ui-layer {
            position: absolute;
            top: 8px; left: 8px; right: 8px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            pointer-events: none;
            z-index: 5;
        }
        .stat-panel {
            display: flex; gap: 12px; flex-wrap: wrap;
            background: rgba(17,17,17,0.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 6px 10px;
            backdrop-filter: blur(6px);
        }
        .stat-item { min-width: 58px; display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.55rem; color: #9aa4ad; letter-spacing: 1px; text-transform: uppercase; }
        .stat-value { font-family: 'Bungee', cursive; font-size: 1rem; color: var(--neon-blue); }
        .stat-value.score { color: var(--gold); }
        .stat-value.combo { color: var(--neon-pink); }
        .lives { color: var(--neon-pink); font-size: 1rem; letter-spacing: 1px; }

        .health-bar { width: 120px; height: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
        .health-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00e676, #00b248); box-shadow: 0 0 10px #00e676; transition: width 0.25s ease; }

        #muteBtn { pointer-events: auto; background: var(--card-bg); border: 2px solid var(--neon-blue); color: var(--neon-blue); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 0 10px rgba(0,210,255,0.25); }

        /* Boss UI */
        #boss-ui { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 70%; text-align: center; display: none; }
        #boss-ui .title { font-family: 'Bungee', cursive; color: var(--neon-pink); font-size: 0.9rem; letter-spacing: 2px; }
        .hp-bg { width: 100%; height: 8px; background: #2a0a0f; border: 1px solid #ff4477; border-radius: 6px; margin-top: 6px; overflow: hidden; }
        #boss-hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4477, #ff8800); box-shadow: 0 0 10px #ff4477; }

        /* Combo pop */
        .combo-pop { position: absolute; font-family: 'Bungee', cursive; color: var(--neon-pink); text-shadow: 0 0 12px var(--neon-pink); pointer-events: none; animation: pop 0.7s ease-out forwards; z-index: 6; }
        @keyframes pop { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-40px) scale(1.2); opacity: 0; } }

        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 20; backdrop-filter: blur(6px); padding: 20px; }
        .modal.show { display: flex; }
        .modal-card { background: var(--card-bg); border: 2px solid var(--neon-blue); border-radius: 16px; box-shadow: 0 0 30px rgba(0,210,255,0.2); width: 90%; max-width: 420px; padding: 28px; text-align: center; }
        .modal-card h1 { font-family: 'Bungee', cursive; font-size: 1.8rem; margin-bottom: 8px; background: linear-gradient(to right, var(--neon-blue), var(--neon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal-card p { color: #cfd8dc; margin-bottom: 16px; }
        .btn { pointer-events: auto; background: var(--neon-blue); color: #000; border: 0; border-radius: 10px; padding: 12px 22px; font-family: 'Bungee', cursive; width: 100%; cursor: pointer; transition: .2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 18px rgba(0,210,255,0.4); }

        @media (max-width: 620px) {
            .stat-value { font-size: 0.9rem; }
            .stat-label { font-size: 0.5rem; }
            .health-bar { width: 90px; }
            #boss-ui { top: 52px; width: 86%; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>

        <div id="ui-layer">
            <div class="stat-panel">
                <div class="stat-item">
                    <div class="stat-label">Score</div>
                    <div id="scoreVal" class="stat-value score">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Combo</div>
                    <div id="comboVal" class="stat-value combo">x1</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Lives</div>
                    <div id="livesVal" class="lives">❤️❤️❤️</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Buff</div>
                    <div id="buffName" class="stat-value">NONE</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Health</div>
                    <div class="health-bar"><div id="healthBar" class="health-fill"></div></div>
                </div>
            </div>
            <button id="muteBtn">🔊</button>
        </div>

        <div id="boss-ui">
            <div class="title">BOSS</div>
            <div class="hp-bg"><div id="boss-hp-bar"></div></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="startModal" class="modal show">
        <div class="modal-card">
            <h1>EMOJI OPS</h1>
            <p>Drag or touch to move. Hold to auto-fire. Avoid civilians, defeat invaders, and survive the boss!</p>
            <button class="btn" id="startBtn">Start Mission</button>
        </div>
    </div>

    <div id="gameOverModal" class="modal">
        <div class="modal-card">
            <h1>MISSION FAILED</h1>
            <p id="finalStats">Score: 0</p>
            <button class="btn" id="retryBtn">Retry</button>
        </div>
    </div>

    <script>
        // Canvas
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1000; canvas.height = 562; // 16:9 logical space

        // State
        let game = { score: 0, health: 100, running: false, shake: 0, nextBoss: 200, combo: 0, lastCombo: 0, lives: 3 };
        let player = { x: canvas.width/2, y: canvas.height/2, size: 25, speed: 5, angle: 0, flash: 0, powerup: null, pTimer: 0 };
        let actors = [];
        let projectiles = [];
        let mouse = { x: player.x, y: player.y, down: false };
        let lastShot = 0;
        let spawnTimer = 0;

        // UI Elements
        const bossUI = document.getElementById('boss-ui');
        const bossHpBar = document.getElementById('boss-hp-bar');
        const scoreVal = document.getElementById('scoreVal');
        const comboVal = document.getElementById('comboVal');
        const livesVal = document.getElementById('livesVal');
        const healthBar = document.getElementById('healthBar');
        const buffName = document.getElementById('buffName');
        const startModal = document.getElementById('startModal');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalStats = document.getElementById('finalStats');
        const startBtn = document.getElementById('startBtn');
        const retryBtn = document.getElementById('retryBtn');
        const muteBtn = document.getElementById('muteBtn');

        // Audio
        const AudioEngine = (() => {
            const ctxA = new (window.AudioContext || window.webkitAudioContext)();
            let isMuted = false;
            let musicGain = ctxA.createGain();
            let sfxGain = ctxA.createGain();
            musicGain.connect(ctxA.destination); sfxGain.connect(ctxA.destination);
            musicGain.gain.value = 0.25; sfxGain.gain.value = 0.5;
            let started = false;

            const play = (freq, type, dur, vol, sweepTo) => {
                if (isMuted || !started) return; const o = ctxA.createOscillator(); const g = ctxA.createGain();
                o.type = type; o.frequency.setValueAtTime(freq, ctxA.currentTime);
                if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, ctxA.currentTime + dur);
                g.gain.setValueAtTime(vol, ctxA.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctxA.currentTime + dur);
                o.connect(g); g.connect(sfxGain); o.start(); o.stop(ctxA.currentTime + dur);
            };

            const startMusic = () => {
                if (started) return; started = true; // simple arpeggio loop
                const notes = [220,247,277,294,330,294,277,247];
                let i = 0;
                (function loop(){ if (isMuted) { setTimeout(loop, 500); return; }
                    const o = ctxA.createOscillator(); const g = ctxA.createGain();
                    o.type='triangle'; o.frequency.value=notes[i]; i=(i+1)%notes.length;
                    g.gain.value=0.08; o.connect(g); g.connect(musicGain); o.start(); o.stop(ctxA.currentTime+0.45);
                    setTimeout(loop, 450);
                })();
            };

            return {
                init: () => { ctxA.resume(); startMusic(); },
                toggle: () => { isMuted = !isMuted; muteBtn.textContent = isMuted ? '🔇' : '🔊'; },
                shot: () => play(800,'sawtooth',0.08,0.15),
                hit: () => play(150,'sawtooth',0.2,0.25),
                power: () => play(400,'sine',0.2,0.18,800),
                kill: () => play(600,'square',0.15,0.2,120),
                bossDown: () => { for(let i=0;i<3;i++) setTimeout(()=>play(200-50*i,'sawtooth',0.3,0.3), i*100); }
            };
        })();

        // Helpers
        function updateHUD(){
            scoreVal.textContent = game.score;
            comboVal.textContent = `x${Math.max(1, game.combo)}`;
            livesVal.textContent = '❤️'.repeat(game.lives);
            healthBar.style.width = `${game.health}%`;
            buffName.textContent = player.powerup || 'NONE';
        }
        function addScore(base){
            const mult = Math.max(1, game.combo);
            game.score += Math.floor(base * mult);
        }
        function spawnComboPop(x,y){
            if (game.combo<2) return; const el = document.createElement('div'); el.className='combo-pop';
            el.textContent = `x${game.combo}`;
            el.style.left = `${(x/canvas.width)*100}%`; el.style.top = `${(y/canvas.height)*100}%`;
            document.getElementById('gameContainer').appendChild(el); setTimeout(()=>el.remove(),700);
        }

        // Input (scale-safe)
        function mapToCanvas(clientX, clientY){ const r = canvas.getBoundingClientRect(); return { x:(clientX - r.left) * (canvas.width/r.width), y:(clientY - r.top) * (canvas.height/r.height) }; }
        canvas.addEventListener('mousemove', e=>{ const p = mapToCanvas(e.clientX,e.clientY); mouse.x=p.x; mouse.y=p.y; });
        canvas.addEventListener('mousedown', ()=>{ mouse.down=true; AudioEngine.init(); });
        canvas.addEventListener('mouseup', ()=> mouse.down=false);
        canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; const p=mapToCanvas(t.clientX,t.clientY); mouse.x=p.x; mouse.y=p.y; mouse.down=true; AudioEngine.init(); }, {passive:false});
        canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.touches[0]; const p=mapToCanvas(t.clientX,t.clientY); mouse.x=p.x; mouse.y=p.y; }, {passive:false});
        canvas.addEventListener('touchend', ()=> mouse.down=false);

        // Spawns
        function spawnActor(type='normal'){
            if (!game.running) return; const side=Math.floor(Math.random()*4); let x,y;
            if (side===0){ x=Math.random()*canvas.width; y=-100; }
            else if (side===1){ x=canvas.width+100; y=Math.random()*canvas.height; }
            else if (side===2){ x=Math.random()*canvas.width; y=canvas.height+100; }
            else { x=-100; y=Math.random()*canvas.height; }
            if (type==='boss'){
                actors.push({x,y,emoji:'🦖',isBoss:true,hp:15,maxHp:15,speed:0.8,size:80});
                bossUI.style.display='block'; bossHpBar.style.width='100%';
            } else {
                const isCiv=Math.random()<0.25;
                actors.push({x,y,isCiv,size:28,emoji:isCiv?['🏃','🕺','🚶'][Math.floor(Math.random()*3)]:['👾','👽','🤖'][Math.floor(Math.random()*3)],speed:isCiv?2.8:1.5+(game.score/1500)});
            }
        }

        // Loop
        function update(){
            if (!game.running){ game.shake=0; return; }

            // Powerup timer
            if (player.pTimer>0){ player.pTimer--; if (player.pTimer<=0) player.powerup=null; }

            // Follow pointer
            if (mouse.down){ const dx=mouse.x-player.x, dy=mouse.y-player.y; const d=Math.hypot(dx,dy); if (d>5){ const a=Math.atan2(dy,dx); player.x+=Math.cos(a)*player.speed; player.y+=Math.sin(a)*player.speed; player.angle=a; } }

            // Shooting
            const rate = player.powerup==='MACHINEGUN' ? 80 : 200;
            if (mouse.down && performance.now()-lastShot>rate){ projectiles.push({x:player.x, y:player.y, angle:player.angle}); lastShot=performance.now(); player.flash=2; game.shake=3; AudioEngine.shot(); }

            // Boss gate
            if (game.score>=game.nextBoss){ spawnActor('boss'); game.nextBoss+=200; }

            // Combo decay
            if (performance.now()-game.lastCombo>1500) game.combo=0;

            // Projectiles
            for (let i=projectiles.length-1;i>=0;i--){ const p=projectiles[i]; p.x+=Math.cos(p.angle)*16; p.y+=Math.sin(p.angle)*16; if (p.x<0||p.x>canvas.width||p.y<0||p.y>canvas.height) projectiles.splice(i,1); }

            // Actors
            for (let i=actors.length-1;i>=0;i--){ const a=actors[i]; const ang=Math.atan2(player.y-a.y, player.x-a.x); a.x+=Math.cos(ang)*a.speed; a.y+=Math.sin(ang)*a.speed; const dist=Math.hypot(player.x-a.x, player.y-a.y);
                // Shield push/clear
                if (player.powerup==='SHIELD' && dist<75){ if (!a.isCiv){ if (a.isBoss){ a.x-=Math.cos(ang)*15; a.y-=Math.sin(ang)*15; } else { actors.splice(i,1); continue; } } }
                // Touch
                if (dist < a.size + 15){ if (a.isCiv){ player.powerup=Math.random()<0.5?'MACHINEGUN':'SHIELD'; player.pTimer=400; game.health=Math.min(100, game.health+15); actors.splice(i,1); AudioEngine.power(); }
                    else { game.health -= a.isBoss ? 0.5 : 10; game.shake=8; AudioEngine.hit(); if (!a.isBoss) actors.splice(i,1); }
                    continue; }
                // Bullets
                for (let pi=projectiles.length-1; pi>=0; pi--){ const p=projectiles[pi]; if (Math.hypot(p.x-a.x, p.y-a.y) < a.size){ projectiles.splice(pi,1);
                        if (a.isCiv){ game.health -= 25; game.shake=35; actors.splice(i,1); AudioEngine.hit(); }
                        else if (a.isBoss){ a.hp--; AudioEngine.hit(); bossHpBar.style.width = (a.hp/a.maxHp)*100 + '%'; if (a.hp<=0){ addScore(100); actors.splice(i,1); bossUI.style.display='none'; player.powerup='MACHINEGUN'; player.pTimer=600; AudioEngine.bossDown(); game.combo++; game.lastCombo=performance.now(); spawnComboPop(p.x,p.y); } }
                        else { addScore(10); actors.splice(i,1); AudioEngine.kill(); game.combo++; game.lastCombo=performance.now(); spawnComboPop(p.x,p.y); }
                        break; }
                }
            }

            // Health/lives
            if (game.health <= 0){ game.lives--; if (game.lives>0){ game.health=100; } else { game.running=false; finalStats.textContent=`Score: ${game.score}`; gameOverModal.classList.add('show'); } }

            // Spawns
            if (spawnTimer++>60){ spawnActor(); spawnTimer=0; }

            updateHUD(); if (game.shake>0) game.shake*=0.9;
        }

        function draw(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.save(); if (game.running && game.shake>0.5) ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
            ctx.fillStyle = '#0b1d14'; ctx.fillRect(0,0,canvas.width,canvas.height);

            // Shield aura
            if (game.running && player.powerup==='SHIELD'){ ctx.strokeStyle='#00f2ff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(player.x,player.y,75,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='rgba(0,242,255,0.12)'; ctx.fill(); }

            // Projectiles
            ctx.fillStyle = '#ffde59'; projectiles.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); });

            // Actors (emoji)
            actors.forEach(a=>{ ctx.font = a.isBoss ? '80px Arial' : '32px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(a.emoji,a.x,a.y);
                if (a.isBoss){ // glow
                    ctx.save(); ctx.globalAlpha=0.25; ctx.shadowBlur=10; ctx.shadowColor='#ff4477'; ctx.fillText(a.emoji,a.x,a.y); ctx.restore(); }
            });

            // Player
            ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.angle);
            ctx.fillStyle='#cd853f'; ctx.beginPath(); ctx.ellipse(0,0,22,16,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#333'; ctx.fillRect(12,-2,35,8);
            if (player.flash-- > 0){ ctx.fillStyle='#ffaa00'; ctx.beginPath(); ctx.arc(50,2,12,0,Math.PI*2); ctx.fill(); }
            ctx.restore();
            ctx.restore();
        }

        function loop(){ update(); draw(); requestAnimationFrame(loop); }
        loop();

        // Controls
        startBtn.addEventListener('click', ()=>{ startModal.classList.remove('show'); game.running=true; AudioEngine.init(); updateHUD(); });
        retryBtn.addEventListener('click', ()=>{ location.reload(); });
        muteBtn.addEventListener('click', ()=> AudioEngine.toggle());
    </script>
</body>
</html>
