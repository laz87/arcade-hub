<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Spin - Guess the Character</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff0055;
            --neon-purple: #bc13fe;
            --dark-bg: #0b0e14;
            --card-bg: #1a1d24;
            --gold: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 85, 0.05) 0%, transparent 40%);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Bungee', cursive;
            font-size: 2.5rem;
            margin: 20px 0;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            letter-spacing: 2px;
            text-align: center;
        }

        #game-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .stat-label { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-family: 'Bungee', cursive; font-size: 1.1rem; color: var(--neon-blue); }
        .stat-value.score { color: var(--gold); }
        .stat-value.lives { color: var(--neon-pink); }

        #game-container {
            position: relative;
            width: 320px;
            height: 320px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 210, 255, 0.2);
            border: 3px solid #333;
        }

        #mystery-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            z-index: 1;
        }

        #grid-overlay {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 2;
        }

        .tile {
            background-color: #1a1d24;
            border: 1px solid #0b0e14;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(1);
        }

        .tile.revealed {
            opacity: 0;
            transform: scale(0.8) rotate(10deg);
            pointer-events: none;
        }

        .controls {
            margin-top: 25px;
            width: 100%;
            max-width: 400px;
            padding: 0 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        input {
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid #333;
            background: var(--card-bg);
            color: white;
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: 900;
            font-family: 'Bungee', cursive;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            font-size: 0.9rem;
        }

        button:active:not(:disabled) { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .btn-spin {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
        }

        .btn-guess {
            background: linear-gradient(45deg, var(--neon-blue), #00a8ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-hint {
            grid-column: span 2;
            background: #2a2a2a;
            color: #aaa;
            font-size: 0.75rem;
        }

        .btn-hint:not(:disabled):hover {
            background: #3a3a3a;
            color: white;
        }

        /* Screens */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
            padding: 20px;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 24px;
            text-align: center;
            border: 2px solid var(--neon-blue);
            width: 100%;
            max-width: 350px;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
        }

        .streak-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: var(--gold);
            color: black;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.8rem;
            transform: rotate(10deg);
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: rotate(10deg) scale(1); }
            to { transform: rotate(10deg) scale(1.1); }
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .shake { animation: shake 0.3s; border-color: var(--neon-pink) !important; }

        @keyframes success-pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }

        .success-flash { animation: success-pulse 0.6s; border-color: var(--neon-blue) !important; }

        .hint-text {
            font-size: 0.85rem;
            color: var(--gold);
            margin-top: 8px;
            min-height: 20px;
            font-weight: 600;
            text-align: center;
        }

        @media (max-height: 700px) {
            h1 { font-size: 2rem; margin: 10px 0; }
            #game-container { width: 280px; height: 280px; }
        }
    </style>
</head>
<body>

    <h1>ANIME SPIN</h1>

    <div id="game-stats">
        <div class="stat-item">
            <span class="stat-label">Level</span>
            <span id="level-val" class="stat-value">1</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Score</span>
            <span id="score-val" class="stat-value score">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Lives</span>
            <span id="lives-val" class="stat-value lives">❤❤❤</span>
        </div>
    </div>

    <div id="game-container">
        <div id="streak-tag" class="streak-badge">3X STREAK!</div>
        <img id="mystery-image" src="" alt="Anime Character">
        <div id="grid-overlay"></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="text" id="guess-input" placeholder="Who is this?" autocomplete="off">
            <div id="hint-display" class="hint-text"></div>
        </div>
        <div class="button-grid">
            <button class="btn-spin" id="spin-btn">SPIN (-10)</button>
            <button class="btn-guess" id="guess-btn">GUESS</button>
            <button class="btn-hint" id="hint-btn">GET HINT (-50)</button>
        </div>
    </div>

    <div id="game-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="font-family: 'Bungee'; font-size: 2rem; margin-bottom: 15px; color: var(--neon-pink);">GAME OVER</h2>
            <p id="modal-msg" style="margin-bottom: 25px; line-height: 1.6; font-size: 1.1rem; color: #ccc;"></p>
            <button class="btn-guess" style="width: 100%" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const characters = [
            { name: "zoro", hint: "marimo", img: "1.webp" },
            { name: "luffy", hint: "Straw Hat Captain", img: "2.webp" },
            { name: "gaban", hint: "left hand", img: "3.webp" },
            { name: "blackbeard", hint: " Captain", img: "4.webp" },
            { name: "brook", hint: "skeleton", img: "5.webp" },
            { name: "imu", hint: "world king", img: "6.webp" },
            { name: "hajrudin", hint: "giant", img: "7.webp" },
            { name: "wapol", hint: "king", img: "8.webp" },
            { name: "doflamingo", hint: "former warlord", img: "9.webp" },
            { name: "usopp", hint: "sniper", img: "10.webp" },
       
        ];

        let state = {
            score: 100,
            level: 1,
            lives: 3,
            streak: 0,
            currentChar: null,
            tiles: [],
            revealedCount: 0,
            hintUsed: false
        };

        const elements = {
            grid: document.getElementById('grid-overlay'),
            img: document.getElementById('mystery-image'),
            input: document.getElementById('guess-input'),
            score: document.getElementById('score-val'),
            level: document.getElementById('level-val'),
            lives: document.getElementById('lives-val'),
            spinBtn: document.getElementById('spin-btn'),
            guessBtn: document.getElementById('guess-btn'),
            hintBtn: document.getElementById('hint-btn'),
            hintText: document.getElementById('hint-display'),
            modal: document.getElementById('game-modal'),
            modalTitle: document.getElementById('modal-title'),
            modalMsg: document.getElementById('modal-msg'),
            streakTag: document.getElementById('streak-tag'),
            gameContainer: document.getElementById('game-container')
        };

        function initLevel() {
            let nextChar;
            do {
                nextChar = characters[Math.floor(Math.random() * characters.length)];
            } while (nextChar === state.currentChar && characters.length > 1);
            
            state.currentChar = nextChar;
            state.revealedCount = 0;
            state.hintUsed = false;
            
            elements.img.src = state.currentChar.img;
            elements.input.value = "";
            elements.hintText.innerText = "";
            elements.streakTag.style.display = state.streak >= 3 ? 'block' : 'none';
            elements.streakTag.innerText = `${state.streak}X STREAK!`;

            elements.grid.innerHTML = '';
            state.tiles = [];
            for (let i = 0; i < 25; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                elements.grid.appendChild(tile);
                state.tiles.push(tile);
            }

            revealTiles(2, false);
            updateUI();
        }

        function revealTiles(count, deductScore = true) {
            let hidden = state.tiles.filter(t => !t.classList.contains('revealed'));
            if (hidden.length === 0) return;

            for (let i = 0; i < count && hidden.length > 0; i++) {
                let idx = Math.floor(Math.random() * hidden.length);
                hidden[idx].classList.add('revealed');
                hidden.splice(idx, 1);
                state.revealedCount++;
            }

            if (deductScore) {
                state.score = Math.max(0, state.score - 10);
                updateUI();
            }
        }

        function checkGuess() {
            const val = elements.input.value.toLowerCase().trim();
            const correct = state.currentChar.name;

            if (val === correct || (val.length > 3 && correct.includes(val))) {
                // SUCCESS
                const pointsGained = Math.max(20, 100 - (state.revealedCount * 4));
                const multiplier = 1 + (Math.floor(state.streak / 3) * 0.5);
                const finalPoints = Math.floor(pointsGained * multiplier);
                
                state.score += finalPoints;
                state.streak++;
                state.level++;
                
                elements.gameContainer.classList.add('success-flash');
                setTimeout(() => elements.gameContainer.classList.remove('success-flash'), 600);

                initLevel();
            } else {
                // FAIL
                state.lives--;
                state.streak = 0;
                elements.input.classList.add('shake');
                setTimeout(() => elements.input.classList.remove('shake'), 300);
                
                if (state.lives <= 0) {
                    gameOver();
                } else {
                    updateUI();
                }
            }
        }

        function getHint() {
            if (state.score >= 50 && !state.hintUsed) {
                state.score -= 50;
                state.hintUsed = true;
                elements.hintText.innerText = "HINT: " + state.currentChar.hint;
                updateUI();
            }
        }

        function updateUI() {
            elements.score.innerText = state.score;
            elements.level.innerText = state.level;
            elements.lives.innerText = "❤".repeat(Math.max(0, state.lives));
            elements.spinBtn.disabled = state.score < 10 || state.tiles.filter(t => !t.classList.contains('revealed')).length === 0;
            elements.hintBtn.disabled = state.hintUsed || state.score < 50;
        }

        function gameOver() {
            elements.modalTitle.innerText = "GAME OVER";
            elements.modalMsg.innerHTML = `You reached <b>Level ${state.level}</b><br>Final Score: <b>${state.score}</b>`;
            elements.modal.classList.add('active');
        }

        function resetGame() {
            state = {
                score: 100,
                level: 1,
                lives: 3,
                streak: 0,
                currentChar: null,
                tiles: [],
                revealedCount: 0,
                hintUsed: false
            };
            elements.modal.classList.remove('active');
            initLevel();
        }

        elements.spinBtn.addEventListener('click', () => revealTiles(3));
        elements.guessBtn.addEventListener('click', checkGuess);
        elements.hintBtn.addEventListener('click', getHint);
        elements.input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkGuess();
        });

        window.onload = initLevel;
    </script>
</body>
</html>
